<script type="text/babel">
var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useMemo=React.useMemo;

// ── COLORS ───────────────────────────────────────────────────────────────────

// ── DATA ─────────────────────────────────────────────────────────────────────
var PCAT=[
  {label:"GLP-1 / Metabolic",compounds:["Retatrutide","Tirzepatide","Semaglutide","Liraglutide","Dulaglutide","Exenatide","Lixisenatide","Eloralintide","CB4211","Cagrilintide","CagriSema","VK2735","CT-388","MariTide (AMG-133)","Pemvidutide","Survodutide","Mazdutide","Efinopegdutide","Oxyntomodulin","Amylin","Pramlintide","Adropin"]},
  {label:"Growth Hormone / IGF-1",compounds:["HGH (Somatropin)","Somapacitan","Lonapegsomatropin","Tesamorelin","CJC-1295","CJC-1295 DAC","Mod GRF 1-29","Sermorelin","Ipamorelin","GHRP-2","GHRP-6","Hexarelin","Alexamorelin","IGF-1 LR3","IGF-1 DES","PEG-MGF","MGF","Mecasermin","AOD-9604"]},

  {label:"Cosmetic & Dermatology",compounds:["GHK-Cu","AHK-Cu","Melanotan I","Melanotan II","KTTKS (Matrixyl)","Pal-KTTKS","Copper Tripeptide-1"]},

  {label:"Neurology / Cognitive / Sleep",compounds:["Semax","NA-Semax Amidate","Selank","NA-Selank Amidate","Dihexa","P21","DSIP","PE-22-28","NAP (Davunetide)","Cerebrolysin","Cortagen","DDNSP","Retinalamin","Pinealon"]},
  {label:"Immune / Thymic",compounds:["Thymosin Alpha-1 (TA-1)","Thymosin Beta-4","Thymalin","Thymogen","Thymulin","Thymopentin","TP5","TP508","Vilon","LL-37","KPV"]},

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function getCat(name,cats){for(var i=0;i<cats.length;i++){if(cats[i].compounds.indexOf(name)>-1)return cats[i].label;}return "Other";}

// ── NORMALIZE old/new field names ────────────────────────────────────────────
function norm(i){
  var cpk=parseFloat(i.cpk!==undefined?i.cpk:i.costPerKit)||0;
  var ship=parseFloat(i.ship!==undefined?i.ship:i.shipping)||0;
  var fees=parseFloat(i.fees)||0;
  var kits=parseInt(i.kits||i.kitsQty)||1;
  var vpk=parseInt(i.vpk||i.vialsPerKit)||10;
  var qv=parseInt(i.qtyVials)||(kits*vpk);
  var tot=parseFloat(i.totalCost)||((cpk*kits)+ship+fees);
  var cpv=parseFloat(i.cpv||i.costPerVial)||(qv>0?tot/qv:0);
  var str=i.strength!==undefined?i.strength:(i.mg!==undefined?i.mg:null);
  var strN=str!==null?parseFloat(str):null;
  var cpu=parseFloat(i.cpu||i.costPerUnit)||(strN&&cpv?cpv/strN:null)||null;
  return {
    id:uid(),
    displayCompound:i.displayCompound||i.compound||"",
    strength:strN,unit:i.unit||i.strengthUnit||"mg",
    vendor:i.vendor||"",lot:i.lot||i.lotNumber||"",
    kits:kits,vpk:vpk,qtyVials:qv,originalQty:parseInt(i.originalQty)||qv,
    cpk:cpk,ship:ship,fees:fees,totalCost:tot,cpv:cpv,cpu:cpu,
    mass:!!(i.mass!==undefined?i.mass:i.hasMass),
    purity:!!(i.purity!==undefined?i.purity:i.hasPurity),
    endo:!!(i.endo!==undefined?i.endo:i.hasEndotoxin),
    coa:i.coa||i.coaLink||"",overfill:i.overfill||"",
    actual:parseFloat(i.actual||i.actualStrength||i.actualMg)||null,
    notes:i.notes||"",dateAdded:i.dateAdded||TODAY,
    status:i.status||"On Hand",eta:i.eta||i.expectedDate||"",
    sales:i.sales||[],totalRevenue:parseFloat(i.totalRevenue)||0,
    totalProfit:parseFloat(i.totalProfit)||0,archived:!!i.archived,log:i.log||[]
  };
}

function load(){
  try{
    var r=localStorage.getItem("peptrack_v3");
    if(r){var d=JSON.parse(r);return{p:(d.p||[]).map(norm),b:(d.b||[]).map(norm),n:(d.n||[]).map(norm),dk:d.dk!==false};}
    var r2=localStorage.getItem("peptrack_v2")||localStorage.getItem("peptide_tracker_v1");
    if(r2){var d2=JSON.parse(r2);var pp=d2.p||d2.peptides||[];var bb=d2.b||d2.blends||[];var nn=d2.n||d2.nonPeptides||[];return{p:pp.map(norm),b:bb.map(norm),n:nn.map(norm),dk:true};}
  }catch(e){}
  return{p:[],b:[],n:[],dk:true};
}
function save(p,b,n,dk){try{localStorage.setItem("peptrack_v3",JSON.stringify({p:p,b:b,n:n,dk:dk}));}catch(e){}}

// ── STYLES ───────────────────────────────────────────────────────────────────
var INP={background:"#1e293b",border:"1px solid #334155",borderRadius:8,color:"#e2e8f0",padding:"8px 12px",fontSize:14,width:"100%",boxSizing:"border-box",outline:"none"};
var LBL={fontSize:11,color:"#64748b",marginBottom:4,display:"block",fontWeight:700,letterSpacing:"0.5px",textTransform:"uppercase"};
var BTN={borderRadius:10,padding:"9px 14px",fontSize:13,fontWeight:700,cursor:"pointer",border:"none"};

// ── EDIT FORM (self-contained, no parent state updates while typing) ──────────
function EditForm(props){
  // props: item (the data), cats, onSave, onCancel
  var item=props.item;
  var cats=props.cats;
  var ref=useRef(null);

  // Build initial form data from item
  var allC=[];
  for(var ci=0;ci<cats.length;ci++){allC=allC.concat(cats[ci].compounds);}
  var hasCompound=allC.indexOf(item.displayCompound)>-1;
  var strOnList=false;
  for(var mi=0;mi<MGS.length;mi++){if(MGS[mi]===item.strength){strOnList=true;break;}}

  var init={
    compound:hasCompound?item.displayCompound:"Other",
    custom:hasCompound?"":item.displayCompound,
    strength:strOnList?String(item.strength):(item.strength?"custom":""),
    customStr:strOnList?"":String(item.strength||""),
    unit:item.unit||"mg",
    vendor:item.vendor||"",
    lot:item.lot||"",
    kits:String(item.kits||1),
    vpk:String(item.vpk||10),
    cpk:String(item.cpk||""),
    ship:String(item.ship||""),
    fees:String(item.fees||""),
    mass:item.mass||false,
    purity:item.purity||false,
    endo:item.endo||false,
    coa:item.coa||"",
    overfill:item.overfill||"",
    actual:String(item.actual||""),
    notes:item.notes||"",
    date:item.dateAdded||TODAY,
    status:item.status||"On Hand",
    eta:item.eta||""
  };

  // Store form data in ref - no state, no re-renders while typing
  if(!ref.current){ref.current=Object.assign({},init);}
  var fd=ref.current;

  function oc(k){return function(e){fd[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;};}

  function handleSave(){
    var dc=fd.compound==="Other"?fd.custom:fd.compound;
    var strNum=fd.strength==="custom"?parseFloat(fd.customStr):parseFloat(fd.strength);
    var kits=parseInt(fd.kits)||1;
    var vpk=parseInt(fd.vpk)||10;
    var tv=kits*vpk;
    var cpk=parseFloat(fd.cpk)||0;
    var ship=parseFloat(fd.ship)||0;
    var fees=parseFloat(fd.fees)||0;
    var tot=(cpk*kits)+ship+fees;
    var cpv=tv>0?tot/tv:0;
    var cpu=(strNum&&cpv)?cpv/strNum:null;
    props.onSave({
      displayCompound:dc,strength:strNum||null,unit:fd.unit||"mg",
      vendor:fd.vendor,lot:fd.lot,kits:kits,vpk:vpk,
      qtyVials:item.qtyVials,originalQty:tv,
      cpk:cpk,ship:ship,fees:fees,totalCost:tot,cpv:cpv,cpu:cpu,
      mass:!!fd.mass,purity:!!fd.purity,endo:!!fd.endo,
      coa:fd.coa,overfill:fd.overfill,
      actual:parseFloat(fd.actual)||null,
      notes:fd.notes,dateAdded:fd.date||TODAY,
      status:fd.status||"On Hand",eta:fd.eta||""
    });
  }

  var inp=INP;
  var lbl=LBL;

  return React.createElement("div",null,
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}},

      // Compound
      React.createElement("div",{style:{marginBottom:12,gridColumn:"1/-1"}},
        React.createElement("label",{style:lbl},"COMPOUND"),
        React.createElement("input",{defaultValue:init.compound==="Other"?init.custom:init.compound,onChange:function(e){fd.compound=e.target.value;fd.custom=e.target.value;},style:inp,placeholder:"Compound name"})
      ),

      // Strength
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"STRENGTH"),
        React.createElement("div",{style:{display:"flex",gap:6}},
          React.createElement("select",{defaultValue:init.strength,onChange:oc("strength"),style:Object.assign({},inp,{flex:2})},
            React.createElement("option",{value:""},"Select..."),
            MGS.map(function(m){return React.createElement("option",{key:m,value:String(m)},m);}),
            React.createElement("option",{value:"custom"},"Custom")
          ),
          React.createElement("select",{defaultValue:init.unit,onChange:oc("unit"),style:Object.assign({},inp,{flex:1})},
            UNITS.map(function(u){return React.createElement("option",{key:u},u);})
          )
        )
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"CUSTOM AMOUNT"),
        React.createElement("input",{defaultValue:init.customStr,onChange:oc("customStr"),style:inp,placeholder:"e.g. 8.5",type:"text",inputMode:"decimal"})
      ),

      // Vendor / Lot
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"VENDOR"),
        React.createElement("input",{defaultValue:init.vendor,onChange:oc("vendor"),style:inp,placeholder:"e.g. WWB"})
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"LOT / BATCH #"),
        React.createElement("input",{defaultValue:init.lot,onChange:oc("lot"),style:inp,placeholder:"Optional"})
      ),

      // Status / ETA
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"STATUS"),
        React.createElement("select",{defaultValue:init.status,onChange:oc("status"),style:inp},
          STATS.map(function(s){return React.createElement("option",{key:s},s);})
        )
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"EXPECTED DATE"),
        React.createElement("input",{type:"date",defaultValue:init.eta,onChange:oc("eta"),style:inp})
      ),

      // Kits / VPK
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"KITS PURCHASED"),
        React.createElement("input",{type:"number",min:"1",defaultValue:init.kits,onChange:oc("kits"),style:inp})
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"VIALS PER KIT"),
        React.createElement("input",{type:"number",min:"1",defaultValue:init.vpk,onChange:oc("vpk"),style:inp})
      ),

      // Costs
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"COST PER KIT ($)"),
        React.createElement("input",{type:"number",defaultValue:init.cpk,onChange:oc("cpk"),style:inp,placeholder:"0.00"})
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"SHIPPING ($)"),
        React.createElement("input",{type:"number",defaultValue:init.ship,onChange:oc("ship"),style:inp,placeholder:"0.00"})
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"FEES / TAX ($)"),
        React.createElement("input",{type:"number",defaultValue:init.fees,onChange:oc("fees"),style:inp,placeholder:"0.00"})
      ),
      React.createElement("div",null),

      // COA
      React.createElement("div",{style:{marginBottom:12,gridColumn:"1/-1"}},
        React.createElement("label",{style:lbl},"COA AVAILABLE"),
        React.createElement("div",{style:{display:"flex",gap:20,flexWrap:"wrap"}},
          [["mass","Mass Spec"],["purity","Purity"],["endo","Endotoxin"]].map(function(pair){
            return React.createElement("label",{key:pair[0],style:{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#cbd5e1",cursor:"pointer"}},
              React.createElement("input",{type:"checkbox",defaultChecked:init[pair[0]],onChange:oc(pair[0]),style:{width:15,height:15,accentColor:"#6366f1"}}),
              pair[1]
            );
          })
        )
      ),
      React.createElement("div",{style:{marginBottom:12,gridColumn:"1/-1"}},
        React.createElement("label",{style:lbl},"COA LINK"),
        React.createElement("input",{defaultValue:init.coa,onChange:oc("coa"),style:inp,placeholder:"https://..."})
      ),

      // Overfill / Actual
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"OVERFILL"),
        React.createElement("select",{defaultValue:init.overfill,onChange:oc("overfill"),style:inp},
          React.createElement("option",{value:""},"Unknown"),
          React.createElement("option",null,"Overfilled"),
          React.createElement("option",null,"Accurate"),
          React.createElement("option",null,"Underfilled")
        )
      ),
      React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:lbl},"ACTUAL "+init.unit.toUpperCase()),
        React.createElement("input",{type:"number",defaultValue:init.actual,onChange:oc("actual"),style:inp,placeholder:"e.g. 10.3"})
      ),

      // Notes / Date
      React.createElement("div",{style:{marginBottom:12,gridColumn:"1/-1"}},
        React.createElement("label",{style:lbl},"NOTES"),
        React.createElement("textarea",{defaultValue:init.notes,onChange:oc("notes"),style:Object.assign({},inp,{minHeight:60,resize:"vertical"}),placeholder:"Any notes..."})
      ),
      React.createElement("div",{style:{marginBottom:12,gridColumn:"1/-1"}},
        React.createElement("label",{style:lbl},"PURCHASE DATE"),
        React.createElement("input",{type:"date",defaultValue:init.date,onChange:oc("date"),style:inp})
      )
    ),

    // Buttons
    React.createElement("div",{style:{display:"flex",gap:10,marginTop:8}},
      React.createElement("button",{onClick:props.onCancel,style:Object.assign({},BTN,{flex:1,background:"#1e293b",color:"#94a3b8",border:"1px solid #334155"})},"Cancel"),
      React.createElement("button",{onClick:handleSave,style:Object.assign({},BTN,{flex:2,background:"#6366f1",color:"#fff"})},(props.isNew?"Add to Inventory":"Save Changes"))
    )
  );
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function Modal(props){
  return React.createElement("div",{
    style:{position:"fixed",inset:0,background:"rgba(2,8,23,.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16},
    onClick:function(e){if(e.target===e.currentTarget)props.onClose();}
  },
    React.createElement("div",{style:{background:"#0f172a",border:"1px solid #1e293b",borderRadius:18,padding:24,width:"100%",maxWidth:600,maxHeight:"92vh",overflowY:"auto",color:"#e2e8f0"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
        React.createElement("h2",{style:{margin:0,fontSize:17,fontWeight:800}},props.title),
        React.createElement("button",{onClick:props.onClose,style:{background:"none",border:"none",color:"#475569",fontSize:24,cursor:"pointer"}},"×")
      ),
      props.children
    )
  );
}

// ── ITEM CARD ─────────────────────────────────────────────────────────────────
function ICard(props){
  var it=props.it;
  var cat=props.cat;
  var acc=CC[cat]||"#6366f1";
  var st=it.status||"On Hand";
  var isOrd=st==="Ordered"||st==="In Transit";
  var stBg=isOrd?"#431407":it.qtyVials===0?"#450a0a":it.qtyVials<=2?"#422006":"#052e16";
  var stCol=isOrd?"#fdba74":it.qtyVials===0?"#fca5a5":it.qtyVials<=2?"#fcd34d":"#86efac";
  var stTxt=isOrd?st:it.qtyVials===0?"Out of Stock":it.qtyVials<=2?"Low ("+it.qtyVials+")":"In Stock ("+it.qtyVials+")";
  return React.createElement("div",{
    style:{background:"#0f172a",border:"1px solid #1e293b",borderLeft:"3px solid "+acc,borderRadius:12,padding:14,cursor:"pointer"},
    onClick:function(){props.onDetail(it.id);}
  },
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}},
      React.createElement("div",null,
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
          React.createElement("span",{style:{fontSize:16,fontWeight:900,color:"#f8fafc"}},it.displayCompound),
          it.strength?React.createElement("span",{style:{background:"#1e293b",color:"#94a3b8",padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700}},it.strength+" "+(it.unit||"mg")):null,
          React.createElement("span",{style:{background:stBg,color:stCol,padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700}},stTxt)
