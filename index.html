<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Peptide Tracker" />
  <meta name="theme-color" content="#020817" />
  <title>Peptide Tracker</title>

  <!-- PWA Manifest inline -->
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Peptide%20Inventory%20Tracker%22%2C%22short_name%22%3A%22Peptides%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020817%22%2C%22theme_color%22%3A%22%23020817%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%3D%270%200%20100%20100%2527%253E%253Crect%2520width%3D%2527100%2527%2520height%3D%2527100%2527%2520rx%3D%252720%2527%2520fill%3D%2527%23020817%2527%2F%253E%253Ctext%2520y%3D%2527.9em%2527%2520font-size%3D%252780%2527%253E%25F0%259F%25A7%25AA%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D" />

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23020817'/><text y='.9em' font-size='80'>🧪</text></svg>" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #020817; color: #e2e8f0; font-family: -apple-system, 'Inter', system-ui, sans-serif; }
    input, select, textarea, button { font-family: inherit; }
    /* Safe area for iPhone notch */
    .safe-top { padding-top: max(18px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(60px, env(safe-area-inset-bottom)); }
  </style>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // ─── DATA ────────────────────────────────────────────────────────────────

    const PEPTIDE_CATEGORIES = [
      { label: "GLP-1 / Metabolic", compounds: ["Retatrutide","Tirzepatide","Semaglutide","Liraglutide","Dulaglutide","Exenatide","Lixisenatide","Eloralintide","CB4211","Cagrilintide","CagriSema","VK2735","CT-388","MariTide (AMG-133)","Pemvidutide","Survodutide","Mazdutide","Efinopegdutide","Oxyntomodulin","Amylin","Pramlintide","Adropin"] },
      { label: "Growth Hormone / IGF-1", compounds: ["HGH (Somatropin)","Somapacitan","Lonapegsomatropin","Tesamorelin","CJC-1295","CJC-1295 DAC","Mod GRF 1-29","Sermorelin","Ipamorelin","GHRP-2","GHRP-6","Hexarelin","Alexamorelin","IGF-1 LR3","IGF-1 DES","PEG-MGF","MGF","Mecasermin","AOD-9604"] },
      { label: "Recovery & Regeneration", compounds: ["BPC-157","TB-500","Thymosin Beta-4","KPV","LL-37","ARA-290 (Cibinetide)","GHK-Cu","AHK-Cu","B7-33","FOXO4-DRI","TP508","P144","AP318","BPC-128","FX06"] },
      { label: "Mitochondrial & Longevity", compounds: ["MOTS-c","SS-31 (Elamipretide)","Humanin","SHLP-1","SHLP-2","SHLP-3","SHLP-4","SHLP-5","SHLP-6","Epithalon (Epitalon)","N-Acetyl Epitalon Amidate","Pinealon","Endoluten","Suprefort","Ventfort","Vladonix"] },
      { label: "Cosmetic & Dermatology", compounds: ["GHK-Cu","AHK-Cu","Melanotan I","Melanotan II","KTTKS (Matrixyl)","Pal-KTTKS","Copper Tripeptide-1"] },
      { label: "Hormonal / Reproductive", compounds: ["Kisspeptin-10","Kisspeptin-54","HCG","PT-141 (Bremelanotide)","Oxytocin","Carbetocin","Leuprolide","Triptorelin","Buserelin","Nafarelin","Deslorelin","Gonadorelin","GnRH","Vasopressin","Desmopressin","Terlipressin","Lypressin"] },
      { label: "Neurology / Cognitive / Sleep", compounds: ["Semax","NA-Semax Amidate","Selank","NA-Selank Amidate","Dihexa","P21","DSIP","PE-22-28","NAP (Davunetide)","Cerebrolysin","Cortagen","DDNSP","Retinalamin","Pinealon"] },
      { label: "Immune / Thymic", compounds: ["Thymosin Alpha-1 (TA-1)","Thymosin Beta-4","Thymalin","Thymogen","Thymulin","Thymopentin","TP5","TP508","Vilon","LL-37","KPV"] },
      { label: "Organ Bioregulators", compounds: ["Bronchogen","Cardiogen","Cartalax","Chonluten","Cortagen","Crystagen","Endoluten","Livagen","Ovargen","Pancregen","Prostamax","Prostatilen","Testagen","Vesilute","Vesugen","Vladonix","Ventfort","Suprefort"] },
      { label: "Muscle & Performance", compounds: ["Follistatin-344","Follistatin-315","ACE-031","Myostatin Propeptide","Activin Receptor Peptides"] },
      { label: "Therapeutic Peptide Drugs", compounds: ["Insulin","Insulin Lispro","Insulin Aspart","Insulin Glargine","Insulin Degludec","Glucagon","Pramlintide","Calcitonin","Teriparatide","Abaloparatide","Secretin","VIP","Cholecystokinin (CCK)","Motilin","GLP-2","Teduglutide","BNP","Nesiritide","Relaxin-2","Apelin","Angiotensin-(1-7)","Somatostatin analogs","Desmopressin (DDAVP)"] },
      { label: "Oncology / Targeted Therapy", compounds: ["LTX-315","PNC-27","PNC-28","BT1718","CEND-1","Melflufen","Lutetium-177 DOTATATE","Neoantigen peptide vaccines","Melittin-derived peptides","Cecropin-derived peptides"] },
      { label: "Antimicrobial", compounds: ["LL-37","Omiganan","Pexiganan","Histatin","Lactoferricin","Defensins","Cathelicidins","RTD-1"] },
      { label: "Research Materials / Biomaterials", compounds: ["FEFKFEFK hydrogel","Peptide-graphene oxide hydrogels","RGD peptides","AP39","AP123","NDX-1017","CN-105","C16","AXT107","P140 (Lupuzor)","GEPP44","PEP20","XPro1595","BT200","ZP1849","AZP-3813","CB5138"] },
      { label: "Other", compounds: ["Other"] },
    ];

    const BLEND_COMPOUNDS = ["KLOW","GLOW","Other"];
    const NONPEPTIDE_CATEGORIES = [
      { label: "NAD+ Pathway", compounds: ["NAD+","NMN","NR (Nicotinamide Riboside)"] },
      { label: "Mitochondrial / Metabolic", compounds: ["5-Amino-1MQ","SLU-PP-332","Urolithin A","CoQ10","BAM15","MK-677","SR9009","Cardarine (GW-501516)"] },
      { label: "Other Small Molecules", compounds: ["Other"] },
    ];

    const MG_OPTIONS = [0.5, 1, 2, 2.5, 4, 5, 6, 7.5, 10, 15, 20, 30, 50];
    const STRENGTH_UNITS = ["mg", "IU", "mcg", "units"];
    const TODAY = new Date().toISOString().split("T")[0];

    const CATEGORY_COLORS = {
      "GLP-1 / Metabolic": "#6366f1", "Growth Hormone / IGF-1": "#0ea5e9",
      "Recovery & Regeneration": "#10b981", "Mitochondrial & Longevity": "#f59e0b",
      "Cosmetic & Dermatology": "#ec4899", "Hormonal / Reproductive": "#a78bfa",
      "Neurology / Cognitive / Sleep": "#38bdf8", "Immune / Thymic": "#34d399",
      "Organ Bioregulators": "#fb923c", "Muscle & Performance": "#f87171",
      "Therapeutic Peptide Drugs": "#94a3b8", "Oncology / Targeted Therapy": "#e879f9",
      "Antimicrobial": "#4ade80", "Research Materials / Biomaterials": "#fbbf24",
      "Blends": "#a3e635", "Non-Peptides": "#67e8f9", "Other": "#64748b",
    };

    function getCategoryForCompound(name, categories) {
      for (const cat of categories) { if (cat.compounds.includes(name)) return cat.label; }
      return null;
    }

    // localStorage persistence
    function loadState() {
      try {
        const raw = localStorage.getItem("peptide_tracker_v1");
        if (raw) return JSON.parse(raw);
      } catch {}
      return { peptides: [], blends: [], nonPeptides: [], nextId: 1 };
    }
    function saveState(data) {
      try { localStorage.setItem("peptide_tracker_v1", JSON.stringify(data)); } catch {}
    }

    const emptyForm = {
      compound: "", customCompound: "",
      strength: "", customStrength: "", strengthUnit: "mg",
      vendor: "", lotNumber: "", kitsQty: 1, vialsPerKit: 10,
      costPerKit: "", shipping: "", fees: "",
      hasMass: false, hasPurity: false, hasEndotoxin: false,
      coaLink: "", overfill: "", actualStrength: "", notes: "",
      purchaseDate: TODAY,
    };

    function calcTotal(form) {
      const kits = parseInt(form.kitsQty) || 1;
      return ((parseFloat(form.costPerKit) || 0) * kits) + (parseFloat(form.shipping) || 0) + (parseFloat(form.fees) || 0);
    }
    function calcVials(form) {
      return (parseInt(form.kitsQty) || 1) * (parseInt(form.vialsPerKit) || 10);
    }

    // ─── SMALL COMPONENTS ────────────────────────────────────────────────────

    function Badge({ children, color, bg }) {
      return <span style={{ background: bg||"#1e293b", color: color||"#94a3b8", padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 700, whiteSpace: "nowrap", display: "inline-block" }}>{children}</span>;
    }

    function CoaBadges({ item }) {
      return (
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          <Badge bg={item.hasMass?"#064e3b":"#1e293b"} color={item.hasMass?"#6ee7b7":"#475569"}>Mass {item.hasMass?"✓":"✗"}</Badge>
          <Badge bg={item.hasPurity?"#064e3b":"#1e293b"} color={item.hasPurity?"#6ee7b7":"#475569"}>Purity {item.hasPurity?"✓":"✗"}</Badge>
          <Badge bg={item.hasEndotoxin?"#064e3b":"#1e293b"} color={item.hasEndotoxin?"#6ee7b7":"#475569"}>Endotoxin {item.hasEndotoxin?"✓":"✗"}</Badge>
        </div>
      );
    }

    function StockBadge({ qty }) {
      if (qty === 0) return <Badge bg="#450a0a" color="#fca5a5">Out of Stock</Badge>;
      if (qty <= 2) return <Badge bg="#422006" color="#fcd34d">Low — {qty} left</Badge>;
      return <Badge bg="#052e16" color="#86efac">In Stock ({qty})</Badge>;
    }

    function CategoryPill({ name }) {
      const color = CATEGORY_COLORS[name] || "#64748b";
      return <span style={{ fontSize: 10, fontWeight: 700, color, background: color+"22", padding: "2px 7px", borderRadius: 8, whiteSpace: "nowrap" }}>{name}</span>;
    }

    const inputStyle = { background: "#1e293b", border: "1px solid #334155", borderRadius: 8, color: "#e2e8f0", padding: "8px 12px", fontSize: 14, width: "100%", boxSizing: "border-box", outline: "none" };
    const labelStyle = { fontSize: 11, color: "#64748b", marginBottom: 4, display: "block", fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase" };

    function Field({ label, children, span }) {
      return <div style={{ marginBottom: 14, gridColumn: span?"1/-1":undefined }}><label style={labelStyle}>{label}</label>{children}</div>;
    }

    function CheckBox({ checked, onChange, label }) {
      return (
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13, color: "#cbd5e1" }}>
          <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} style={{ width: 15, height: 15, accentColor: "#6366f1" }} />{label}
        </label>
      );
    }

    function Modal({ title, onClose, children }) {
      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(2,8,23,0.88)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={e => e.target===e.currentTarget && onClose()}>
          <div style={{ background: "#0f172a", border: "1px solid #1e293b", borderRadius: 18, padding: 24, width: "100%", maxWidth: 600, maxHeight: "92vh", overflowY: "auto", color: "#e2e8f0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h2 style={{ margin: 0, fontSize: 17, color: "#f8fafc", fontWeight: 800 }}>{title}</h2>
              <button onClick={onClose} style={{ background: "none", border: "none", color: "#475569", fontSize: 24, cursor: "pointer" }}>×</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function CompoundSelect({ value, onChange, categories }) {
      const [query, setQuery] = useState("");
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      const allCompounds = categories.flatMap(cat => cat.compounds.map(c => ({ name: c, cat: cat.label })));
      const filtered = query.length > 0 ? allCompounds.filter(c => c.name.toLowerCase().includes(query.toLowerCase())).slice(0,14) : [];

      useEffect(() => {
        function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
        document.addEventListener("mousedown", h);
        return () => document.removeEventListener("mousedown", h);
      }, []);

      function select(name) { onChange(name); setQuery(name==="Other"?"":name); setOpen(false); }
      function handleInput(e) { setQuery(e.target.value); onChange(""); setOpen(true); }
      const displayValue = value && value !== "Other" ? value : query;

      return (
        <div ref={ref} style={{ position: "relative" }}>
          <input value={displayValue} onChange={handleInput} onFocus={() => setOpen(true)}
            placeholder="Type to search or browse…" style={{ ...inputStyle, paddingRight: 32 }} autoComplete="off" />
          {displayValue && (
            <button onClick={() => { onChange(""); setQuery(""); setOpen(false); }}
              style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#475569", fontSize: 18, cursor: "pointer", padding: 0 }}>×</button>
          )}
          {open && (
            <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 300, background: "#0f172a", border: "1px solid #334155", borderRadius: 10, maxHeight: 300, overflowY: "auto", boxShadow: "0 8px 32px rgba(0,0,0,0.6)" }}>
              {query.length === 0 ? categories.map(cat => (
                <div key={cat.label}>
                  <div style={{ padding: "5px 12px 3px", fontSize: 10, color: CATEGORY_COLORS[cat.label]||"#6366f1", fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", background: "#080d1a", position: "sticky", top: 0 }}>{cat.label}</div>
                  {cat.compounds.map(c => (
                    <div key={c} onClick={() => select(c)}
                      style={{ padding: "8px 16px", fontSize: 13, color: "#cbd5e1", cursor: "pointer", borderBottom: "1px solid #0f172a" }}
                      onMouseEnter={e => e.currentTarget.style.background="#1e293b"}
                      onMouseLeave={e => e.currentTarget.style.background="transparent"}>{c}</div>
                  ))}
                </div>
              )) : filtered.length > 0 ? filtered.map(({ name, cat }) => (
                <div key={name} onClick={() => select(name)}
                  style={{ padding: "9px 16px", fontSize: 13, color: "#cbd5e1", cursor: "pointer", borderBottom: "1px solid #1e293b", display: "flex", justifyContent: "space-between", alignItems: "center" }}
                  onMouseEnter={e => e.currentTarget.style.background="#1e293b"}
                  onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                  <span>{name}</span>
                  <span style={{ fontSize: 10, color: CATEGORY_COLORS[cat]||"#475569", fontWeight: 700 }}>{cat}</span>
                </div>
              )) : (
                <div>
                  <div style={{ padding: "10px 16px", fontSize: 13, color: "#475569" }}>No match found</div>
                  <div onClick={() => { onChange("Other"); setOpen(false); }}
                    style={{ padding: "9px 16px", fontSize: 13, color: "#a5b4fc", cursor: "pointer", borderTop: "1px solid #1e293b" }}
                    onMouseEnter={e => e.currentTarget.style.background="#1e293b"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>+ Add as custom compound</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function KitForm({ form, setF, categories }) {
      const total = calcTotal(form);
      const totalVials = calcVials(form);
      const perVial = totalVials > 0 ? total / totalVials : 0;
      const strVal = form.strength === "custom" ? parseFloat(form.customStrength) : parseFloat(form.strength);
      const costPerUnit = (strVal && perVial) ? perVial / strVal : null;
      const unitLabel = form.strengthUnit || "mg";

      return (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
          <Field label="Compound" span>
            <CompoundSelect value={form.compound} onChange={v => setF("compound", v)} categories={categories} />
          </Field>
          {form.compound === "Other" && (
            <Field label="Compound Name" span>
              <input value={form.customCompound} onChange={e => setF("customCompound", e.target.value)} style={inputStyle} placeholder="Enter name…" />
            </Field>
          )}

          <Field label="Strength (per vial)">
            <div style={{ display: "flex", gap: 6 }}>
              <select value={form.strength} onChange={e => setF("strength", e.target.value)} style={{ ...inputStyle, flex: 2 }}>
                <option value="">Select…</option>
                {MG_OPTIONS.map(m => <option key={m} value={m}>{m}</option>)}
                <option value="custom">Custom</option>
              </select>
              <select value={form.strengthUnit} onChange={e => setF("strengthUnit", e.target.value)} style={{ ...inputStyle, flex: 1 }}>
                {STRENGTH_UNITS.map(u => <option key={u}>{u}</option>)}
              </select>
            </div>
          </Field>
          {form.strength === "custom" ? (
            <Field label="Custom amount">
              <input type="text" inputMode="decimal" value={form.customStrength}
                onChange={e => { const v=e.target.value; if(v===""||v==="."||/^\d*\.?\d*$/.test(v)) setF("customStrength",v); }}
                style={inputStyle} placeholder="e.g. 8.5" autoFocus />
            </Field>
          ) : <div />}

          <Field label="Vendor">
            <input value={form.vendor} onChange={e => setF("vendor", e.target.value)} style={inputStyle} placeholder="e.g. PepGen Labs" />
          </Field>
          <Field label="Lot / Batch #">
            <input value={form.lotNumber} onChange={e => setF("lotNumber", e.target.value)} style={inputStyle} placeholder="Optional" />
          </Field>

          <Field label="Kits Purchased">
            <input type="number" min="1" value={form.kitsQty} onChange={e => setF("kitsQty", e.target.value)} style={inputStyle} />
          </Field>
          <Field label="Vials per Kit">
            <input type="number" min="1" value={form.vialsPerKit} onChange={e => setF("vialsPerKit", e.target.value)} style={inputStyle} />
          </Field>

          <Field label="Cost per Kit ($)">
            <input type="number" value={form.costPerKit} onChange={e => setF("costPerKit", e.target.value)} style={inputStyle} placeholder="0.00" />
          </Field>
          <Field label="Shipping ($)">
            <input type="number" value={form.shipping} onChange={e => setF("shipping", e.target.value)} style={inputStyle} placeholder="0.00" />
          </Field>
          <Field label="Fees / Tax ($)">
            <input type="number" value={form.fees} onChange={e => setF("fees", e.target.value)} style={inputStyle} placeholder="0.00" />
          </Field>
          <div />

          <div style={{ gridColumn: "1/-1", background: "#1e293b", borderRadius: 10, padding: "12px 16px", marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: "#64748b", fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase" }}>Cost Summary</div>
            <div style={{ display: "flex", gap: 20, marginTop: 8, flexWrap: "wrap" }}>
              <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase", letterSpacing: 0.5 }}>Total Paid</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: "#a5b4fc" }}>${total.toFixed(2)}</div>
                <div style={{ fontSize: 10, color: "#334155" }}>{form.kitsQty||1} × ${parseFloat(form.costPerKit)||0} + ship/fees</div></div>
              <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase", letterSpacing: 0.5 }}>Total Vials</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: "#818cf8" }}>{totalVials}</div>
                <div style={{ fontSize: 10, color: "#334155" }}>{form.kitsQty||1}×{form.vialsPerKit||10}</div></div>
              <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase", letterSpacing: 0.5 }}>Cost / Vial</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: "#6ee7b7" }}>${perVial.toFixed(2)}</div></div>
              {costPerUnit && <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase", letterSpacing: 0.5 }}>Cost / {unitLabel}</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: "#fbbf24" }}>${costPerUnit.toFixed(4)}</div></div>}
            </div>
          </div>

          <Field label="COA Available" span>
            <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
              <CheckBox checked={form.hasMass} onChange={v => setF("hasMass", v)} label="Mass Spec" />
              <CheckBox checked={form.hasPurity} onChange={v => setF("hasPurity", v)} label="Purity" />
              <CheckBox checked={form.hasEndotoxin} onChange={v => setF("hasEndotoxin", v)} label="Endotoxin" />
            </div>
          </Field>
          <Field label="COA Link" span>
            <input value={form.coaLink} onChange={e => setF("coaLink", e.target.value)} style={inputStyle} placeholder="https://…" />
          </Field>

          <Field label="Overfill Status">
            <select value={form.overfill} onChange={e => setF("overfill", e.target.value)} style={inputStyle}>
              <option value="">Unknown</option>
              <option value="Overfilled">Overfilled</option>
              <option value="Accurate">Accurate</option>
              <option value="Underfilled">Underfilled</option>
            </select>
          </Field>
          <Field label={`Actual ${form.strengthUnit||"mg"} (if tested)`}>
            <input type="number" value={form.actualStrength} onChange={e => setF("actualStrength", e.target.value)} style={inputStyle} placeholder="e.g. 10.3" />
          </Field>

          <Field label="Notes" span>
            <textarea value={form.notes} onChange={e => setF("notes", e.target.value)} style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} placeholder="Any notes…" />
          </Field>
          <Field label="Purchase Date" span>
            <input type="date" value={form.purchaseDate||TODAY} onChange={e => setF("purchaseDate", e.target.value)} style={{ ...inputStyle, colorScheme: "dark" }} />
          </Field>
        </div>
      );
    }

    function ItemCard({ item, onDetail, onAdjust, categoryName }) {
      const accentColor = CATEGORY_COLORS[categoryName] || "#6366f1";
      return (
        <div style={{ background: "#0f172a", border: "1px solid #1e293b", borderLeft: `3px solid ${accentColor}`, borderRadius: 12, padding: 16, cursor: "pointer" }}
          onClick={() => onDetail(item.id)}
          onMouseEnter={e => e.currentTarget.style.borderColor=accentColor}
          onMouseLeave={e => { e.currentTarget.style.borderColor="#1e293b"; e.currentTarget.style.borderLeftColor=accentColor; }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontSize: 18, fontWeight: 900, color: "#f8fafc" }}>{item.displayCompound}</span>
                {item.strength && <Badge bg="#1e293b" color="#94a3b8">{item.strength} {item.strengthUnit||"mg"}</Badge>}
                <StockBadge qty={item.qtyVials} />
              </div>
              <div style={{ fontSize: 12, marginTop: 3 }}>
                <span style={{ color: "#e2e8f0", fontWeight: 800 }}>{item.vendor}</span>
                {item.lotNumber && <span style={{ color: "#475569" }}> · Lot {item.lotNumber}</span>}
                <span style={{ color: "#334155" }}> · {item.dateAdded}</span>
              </div>
              <div style={{ marginTop: 6 }}><CategoryPill name={categoryName} /></div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 20, fontWeight: 900, color: "#a5b4fc" }}>${item.totalCost.toFixed(2)}</div>
              <div style={{ fontSize: 11, color: "#475569" }}>${item.costPerVial.toFixed(2)} / vial</div>
              {item.costPerUnit && <div style={{ fontSize: 11, color: "#fbbf24" }}>${item.costPerUnit.toFixed(4)} / {item.strengthUnit||"mg"}</div>}
            </div>
          </div>
          <div style={{ marginTop: 10, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
            <CoaBadges item={item} />
            <div style={{ display: "flex", gap: 4 }}>
              {item.actualStrength && <Badge>Actual {item.actualStrength} {item.strengthUnit||"mg"}</Badge>}
              {item.overfill && <Badge bg={item.overfill==="Overfilled"?"#052e16":item.overfill==="Underfilled"?"#450a0a":"#1e293b"} color={item.overfill==="Overfilled"?"#86efac":item.overfill==="Underfilled"?"#fca5a5":"#94a3b8"}>{item.overfill}</Badge>}
            </div>
          </div>
          <div style={{ marginTop: 10, display: "flex", gap: 6 }} onClick={e => e.stopPropagation()}>
            {["use","sell","restock"].map(mode => (
              <button key={mode} onClick={() => onAdjust(item.id, mode)} style={{ flex: 1, background: "#1e293b", border: "1px solid #334155", color: mode==="restock"?"#a5b4fc":"#94a3b8", borderRadius: 7, padding: "6px 0", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                {mode==="restock"?"＋ Restock":mode==="use"?"Use":"Sell"}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function GroupedInventory({ items, categories, onDetail, onAdjust, getCat }) {
      const grouped = useMemo(() => {
        const map = {};
        for (const item of items) { const cat = getCat(item.displayCompound)||"Other"; if(!map[cat]) map[cat]=[]; map[cat].push(item); }
        return map;
      }, [items, getCat]);
      const orderedCats = [...categories.map(c=>c.label),"Other"].filter(c=>grouped[c]);
      if (items.length === 0) return <div style={{ textAlign: "center", color: "#334155", padding: "60px 0", fontSize: 15 }}>No items yet — add your first one above.</div>;
      return (
        <div>
          {orderedCats.map(cat => (
            <div key={cat} style={{ marginBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <div style={{ width: 3, height: 16, background: CATEGORY_COLORS[cat]||"#6366f1", borderRadius: 2 }} />
                <span style={{ fontSize: 12, fontWeight: 800, color: CATEGORY_COLORS[cat]||"#6366f1", letterSpacing: 0.5, textTransform: "uppercase" }}>{cat}</span>
                <span style={{ fontSize: 11, color: "#334155" }}>({grouped[cat].length})</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 10 }}>
                {grouped[cat].map(item => <ItemCard key={item.id} item={item} categoryName={cat} onDetail={onDetail} onAdjust={onAdjust} />)}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────

    function App() {
      const initial = loadState();
      const [activeTab, setActiveTab] = useState("peptides");
      const [peptides, setPeptides] = useState(initial.peptides||[]);
      const [blends, setBlends] = useState(initial.blends||[]);
      const [nonPeptides, setNonPeptides] = useState(initial.nonPeptides||[]);
      const [nextId, setNextId] = useState(initial.nextId||1);

      const [showAdd, setShowAdd] = useState(false);
      const [showEdit, setShowEdit] = useState(null);
      const [showDetail, setShowDetail] = useState(null);
      const [showAdjust, setShowAdjust] = useState(null);
      const [adjustMode, setAdjustMode] = useState("use");
      const [adjustQty, setAdjustQty] = useState(1);
      const [adjustUnit, setAdjustUnit] = useState("vial");
      const [form, setForm] = useState(emptyForm);
      const [filterVendor, setFilterVendor] = useState("All");
      const [filterCompound, setFilterCompound] = useState("All");
      const [filterStock, setFilterStock] = useState("All");

      const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

      // Auto-save to localStorage on every change
      useEffect(() => { saveState({ peptides, blends, nonPeptides, nextId }); }, [peptides, blends, nonPeptides, nextId]);

      const tabConfig = {
        peptides: { label: "Peptides", inventory: peptides, setInventory: setPeptides, categories: PEPTIDE_CATEGORIES, getCat: n => getCategoryForCompound(n, PEPTIDE_CATEGORIES) },
        blends: { label: "Blends", inventory: blends, setInventory: setBlends, categories: [{ label: "Blends", compounds: BLEND_COMPOUNDS }], getCat: () => "Blends" },
        nonpeptides: { label: "Non-Peptides", inventory: nonPeptides, setInventory: setNonPeptides, categories: NONPEPTIDE_CATEGORIES, getCat: n => getCategoryForCompound(n, NONPEPTIDE_CATEGORIES)||"Other" },
      };
      const tab = tabConfig[activeTab];

      const vendors = useMemo(() => ["All", ...new Set(tab.inventory.map(i=>i.vendor).filter(Boolean))], [tab.inventory]);
      const compounds = useMemo(() => ["All", ...[...new Set(tab.inventory.map(i=>i.displayCompound).filter(Boolean))].sort()], [tab.inventory]);
      const filtered = useMemo(() => tab.inventory.filter(i => {
        if (filterVendor!=="All" && i.vendor!==filterVendor) return false;
        if (filterCompound!=="All" && i.displayCompound!==filterCompound) return false;
        if (filterStock==="In Stock" && !(i.qtyVials>2)) return false;
        if (filterStock==="Low" && !(i.qtyVials>0&&i.qtyVials<=2)) return false;
        if (filterStock==="Out of Stock" && i.qtyVials>0) return false;
        return true;
      }), [tab.inventory, filterVendor, filterCompound, filterStock]);

      const allItems = [...peptides,...blends,...nonPeptides];
      const totalInvested = allItems.reduce((s,i)=>s+i.totalCost,0);
      const totalVials = allItems.reduce((s,i)=>s+i.qtyVials,0);

      function buildItem(form, id) {
        const displayCompound = form.compound==="Other" ? form.customCompound : form.compound;
        const strVal = form.strength==="custom" ? parseFloat(form.customStrength) : parseFloat(form.strength);
        const total = calcTotal(form);
        const kits = parseInt(form.kitsQty)||1;
        const vialsPerKit = parseInt(form.vialsPerKit)||10;
        const totalVials = kits * vialsPerKit;
        const costPerVial = totalVials>0 ? total/totalVials : total;
        const costPerUnit = (strVal&&costPerVial) ? costPerVial/strVal : null;
        return {
          id, displayCompound, strength: strVal||null, strengthUnit: form.strengthUnit||"mg",
          vendor: form.vendor, lotNumber: form.lotNumber,
          kitsQty: kits, vialsPerKit, qtyVials: totalVials, originalQty: totalVials,
          costPerKit: parseFloat(form.costPerKit)||0, shipping: parseFloat(form.shipping)||0, fees: parseFloat(form.fees)||0,
          totalCost: total, costPerVial, costPerUnit,
          hasMass: form.hasMass, hasPurity: form.hasPurity, hasEndotoxin: form.hasEndotoxin,
          coaLink: form.coaLink, overfill: form.overfill, actualStrength: parseFloat(form.actualStrength)||null,
          notes: form.notes, dateAdded: form.purchaseDate||TODAY,
          log: [`Added ${kits} kit${kits>1?"s":""} (${totalVials} vials) — purchased ${form.purchaseDate||TODAY}`],
        };
      }

      function handleAdd() {
        tab.setInventory(prev => [...prev, buildItem(form, nextId)]);
        setNextId(n=>n+1); setForm(emptyForm); setShowAdd(false);
      }

      function openEdit(item) {
        setForm({
          compound: tab.categories.flatMap(c=>c.compounds).includes(item.displayCompound) ? item.displayCompound : "Other",
          customCompound: tab.categories.flatMap(c=>c.compounds).includes(item.displayCompound) ? "" : item.displayCompound,
          strength: MG_OPTIONS.includes(item.strength) ? String(item.strength) : item.strength?"custom":"",
          customStrength: MG_OPTIONS.includes(item.strength) ? "" : item.strength?String(item.strength):"",
          strengthUnit: item.strengthUnit||"mg",
          vendor: item.vendor||"", lotNumber: item.lotNumber||"",
          kitsQty: item.kitsQty||1, vialsPerKit: item.vialsPerKit||10,
          costPerKit: item.costPerKit||"", shipping: item.shipping||"", fees: item.fees||"",
          hasMass: item.hasMass||false, hasPurity: item.hasPurity||false, hasEndotoxin: item.hasEndotoxin||false,
          coaLink: item.coaLink||"", overfill: item.overfill||"",
          actualStrength: item.actualStrength||"", notes: item.notes||"",
          purchaseDate: item.dateAdded||TODAY,
        });
        setShowEdit(item.id); setShowDetail(null);
      }

      function handleSaveEdit() {
        const displayCompound = form.compound==="Other" ? form.customCompound : form.compound;
        const strVal = form.strength==="custom" ? parseFloat(form.customStrength) : parseFloat(form.strength);
        const total = calcTotal(form);
        const kits = parseInt(form.kitsQty)||1;
        const vialsPerKit = parseInt(form.vialsPerKit)||10;
        const totalVials = kits*vialsPerKit;
        tab.setInventory(prev => prev.map(item => {
          if (item.id!==showEdit) return item;
          const costPerVial = totalVials>0 ? total/totalVials : total;
          const costPerUnit = (strVal&&costPerVial) ? costPerVial/strVal : null;
          return { ...item, displayCompound, strength: strVal||null, strengthUnit: form.strengthUnit||"mg",
            vendor: form.vendor, lotNumber: form.lotNumber, kitsQty: kits, vialsPerKit, originalQty: totalVials,
            costPerKit: parseFloat(form.costPerKit)||0, shipping: parseFloat(form.shipping)||0, fees: parseFloat(form.fees)||0,
            totalCost: total, costPerVial, costPerUnit,
            hasMass: form.hasMass, hasPurity: form.hasPurity, hasEndotoxin: form.hasEndotoxin,
            coaLink: form.coaLink, overfill: form.overfill, actualStrength: parseFloat(form.actualStrength)||null,
            notes: form.notes, dateAdded: form.purchaseDate||item.dateAdded,
            log: [...(item.log||[]), `Edited on ${new Date().toLocaleDateString()}`],
          };
        }));
        setShowEdit(null); setForm(emptyForm);
      }

      function openAdjust(id, mode) { setShowAdjust(id); setAdjustMode(mode); setAdjustQty(1); setAdjustUnit("vial"); }

      function handleAdjust() {
        const qty = parseInt(adjustQty)||1;
        tab.setInventory(prev => prev.map(item => {
          if (item.id!==showAdjust) return item;
          const vialCount = adjustUnit==="kit" ? qty*(item.vialsPerKit||1) : qty;
          const delta = adjustMode==="restock" ? vialCount : -vialCount;
          const newQty = Math.max(0, item.qtyVials+delta);
          const label = adjustUnit==="kit" ? `${qty} kit${qty>1?"s":""} (${vialCount} vials)` : `${vialCount} vial${vialCount>1?"s":""}`;
          const action = adjustMode==="restock" ? `Restocked +${label}` : adjustMode==="sell" ? `Sold ${label}` : `Used ${label}`;
          return { ...item, qtyVials: newQty, log: [...(item.log||[]), `${action} on ${new Date().toLocaleDateString()} → ${newQty} vials remaining`] };
        }));
        setShowAdjust(null);
      }

      function handleExport() {
        const data = { peptides, blends, nonPeptides, exportedAt: new Date().toISOString(), version: 1 };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href=url; a.download=`peptide-inventory-${TODAY}.json`; a.click();
        URL.revokeObjectURL(url);
      }

      function handleImport(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.peptides) setPeptides(data.peptides);
            if (data.blends) setBlends(data.blends);
            if (data.nonPeptides) setNonPeptides(data.nonPeptides);
            const count = (data.peptides||[]).length+(data.blends||[]).length+(data.nonPeptides||[]).length;
            alert(`✅ Imported ${count} kits successfully!`);
          } catch { alert("Invalid file. Please use a peptide tracker export file."); }
        };
        reader.readAsText(file); e.target.value="";
      }

      const detailItem = tab.inventory.find(i=>i.id===showDetail);
      const adjustItem = tab.inventory.find(i=>i.id===showAdjust);
      const editItem = tab.inventory.find(i=>i.id===showEdit);
      const TABS = ["peptides","blends","nonpeptides"];
      const TAB_LABELS = { peptides:"Peptides", blends:"Blends", nonpeptides:"Non-Peptides" };

      return (
        <div style={{ minHeight: "100vh", background: "#020817", color: "#e2e8f0", paddingBottom: 60 }} className="safe-bottom">

          {/* Header */}
          <div style={{ background: "linear-gradient(135deg, #0f172a 0%, #1a1040 100%)", borderBottom: "1px solid #1e293b", padding: "18px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }} className="safe-top">
            <div>
              <div style={{ fontSize: 10, letterSpacing: 2.5, color: "#6366f1", fontWeight: 800, marginBottom: 2 }}>PEPTIDE</div>
              <h1 style={{ margin: 0, fontSize: 21, fontWeight: 900, color: "#f8fafc" }}>Inventory Tracker</h1>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ fontSize: 12, color: "#475569" }}>
                <span style={{ color: "#a5b4fc", fontWeight: 800 }}>${totalInvested.toFixed(2)}</span> · <span style={{ color: "#a5b4fc", fontWeight: 800 }}>{totalVials}</span> vials
              </div>
              <label style={{ background: "#1e293b", color: "#94a3b8", border: "1px solid #334155", borderRadius: 10, padding: "8px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                ⬆ Import<input type="file" accept=".json" onChange={handleImport} style={{ display: "none" }} />
              </label>
              <button onClick={handleExport} style={{ background: "#1e293b", color: "#94a3b8", border: "1px solid #334155", borderRadius: 10, padding: "8px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>⬇ Export</button>
              <button onClick={() => { setForm(emptyForm); setShowAdd(true); }} style={{ background: "#6366f1", color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>+ Add</button>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", borderBottom: "1px solid #1e293b", background: "#0a0f1e" }}>
            {TABS.map(t => (
              <button key={t} onClick={() => { setActiveTab(t); setFilterVendor("All"); setFilterCompound("All"); setFilterStock("All"); }}
                style={{ background: "none", border: "none", borderBottom: activeTab===t?"2px solid #6366f1":"2px solid transparent", color: activeTab===t?"#a5b4fc":"#475569", padding: "12px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                {TAB_LABELS[t]} <span style={{ marginLeft: 5, background: activeTab===t?"#6366f133":"#1e293b", color: activeTab===t?"#818cf8":"#334155", borderRadius: 10, padding: "1px 6px", fontSize: 11, fontWeight: 800 }}>{tabConfig[t].inventory.length}</span>
              </button>
            ))}
          </div>

          {/* Stats */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", background: "#0a0f1e", borderBottom: "1px solid #1e293b" }}>
            {[{ label:"Kits", val:tab.inventory.length },{ label:"Vials", val:tab.inventory.reduce((s,i)=>s+i.qtyVials,0) },{ label:"Invested", val:`$${tab.inventory.reduce((s,i)=>s+i.totalCost,0).toFixed(2)}` },{ label:"Vendors", val:vendors.length-1 }].map(s => (
              <div key={s.label} style={{ padding: "10px 14px", borderRight: "1px solid #1e293b" }}>
                <div style={{ fontSize: 10, color: "#334155", fontWeight: 800, textTransform: "uppercase" }}>{s.label}</div>
                <div style={{ fontSize: 18, fontWeight: 900, color: "#818cf8", marginTop: 1 }}>{s.val}</div>
              </div>
            ))}
          </div>

          {/* Filters */}
          <div style={{ padding: "10px 16px", display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", borderBottom: "1px solid #1e293b", background: "#080d1a" }}>
            {[
              { label: "VENDOR", value: filterVendor, onChange: setFilterVendor, options: vendors },
              { label: "COMPOUND", value: filterCompound, onChange: setFilterCompound, options: compounds },
              { label: "STOCK", value: filterStock, onChange: setFilterStock, options: ["All","In Stock","Low","Out of Stock"] },
            ].map(f => (
              <div key={f.label} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontSize: 9, color: "#334155", fontWeight: 800, letterSpacing: 1 }}>{f.label}</span>
                <select value={f.value} onChange={e => f.onChange(e.target.value)} style={{ ...inputStyle, width: "auto", fontSize: 12, padding: "5px 8px" }}>
                  {f.options.map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
            ))}
            {(filterVendor!=="All"||filterCompound!=="All"||filterStock!=="All") && (
              <button onClick={() => { setFilterVendor("All"); setFilterCompound("All"); setFilterStock("All"); }} style={{ background: "none", border: "1px solid #334155", color: "#64748b", borderRadius: 7, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Clear</button>
            )}
            {filtered.length!==tab.inventory.length && <span style={{ fontSize: 11, color: "#475569" }}>Showing {filtered.length} of {tab.inventory.length}</span>}
          </div>

          {/* Inventory */}
          <div style={{ padding: "16px 16px" }}>
            <GroupedInventory items={filtered} categories={tab.categories} getCat={tab.getCat} onDetail={id=>setShowDetail(id)} onAdjust={openAdjust} />
          </div>

          {/* Add Modal */}
          {showAdd && (
            <Modal title={`Add Kit — ${tab.label}`} onClose={() => setShowAdd(false)}>
              <KitForm form={form} setF={setF} categories={tab.categories} />
              <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
                <button onClick={() => setShowAdd(false)} style={{ flex: 1, background: "#1e293b", border: "1px solid #334155", color: "#64748b", borderRadius: 10, padding: "11px 0", fontSize: 14, cursor: "pointer" }}>Cancel</button>
                <button onClick={handleAdd} disabled={!form.compound||!form.vendor} style={{ flex: 2, background: form.compound&&form.vendor?"#6366f1":"#1e293b", color: form.compound&&form.vendor?"#fff":"#334155", border: "none", borderRadius: 10, padding: "11px 0", fontSize: 14, fontWeight: 800, cursor: form.compound&&form.vendor?"pointer":"not-allowed" }}>Add to Inventory</button>
              </div>
            </Modal>
          )}

          {/* Edit Modal */}
          {showEdit && editItem && (
            <Modal title={`Edit — ${editItem.displayCompound}`} onClose={() => { setShowEdit(null); setForm(emptyForm); }}>
              <KitForm form={form} setF={setF} categories={tab.categories} />
              <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
                <button onClick={() => { setShowEdit(null); setForm(emptyForm); }} style={{ flex: 1, background: "#1e293b", border: "1px solid #334155", color: "#64748b", borderRadius: 10, padding: "11px 0", fontSize: 14, cursor: "pointer" }}>Cancel</button>
                <button onClick={handleSaveEdit} style={{ flex: 2, background: "#6366f1", color: "#fff", border: "none", borderRadius: 10, padding: "11px 0", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>Save Changes</button>
              </div>
            </Modal>
          )}

          {/* Adjust Modal */}
          {showAdjust && adjustItem && (() => {
            const qty = parseInt(adjustQty)||1;
            const vialCount = adjustUnit==="kit" ? qty*(adjustItem.vialsPerKit||1) : qty;
            const remaining = Math.max(0, adjustItem.qtyVials-(adjustMode!=="restock"?vialCount:0));
            return (
              <Modal title={`${adjustItem.displayCompound}${adjustItem.strength?` · ${adjustItem.strength} ${adjustItem.strengthUnit||"mg"}`:""}`} onClose={() => setShowAdjust(null)}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
                  <div style={{ background: "#1e293b", borderRadius: 10, padding: "12px 14px" }}>
                    <div style={{ fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>Vials Left</div>
                    <div style={{ fontSize: 26, fontWeight: 900, color: "#f1f5f9" }}>{adjustItem.qtyVials}</div>
                  </div>
                  <div style={{ background: "#1e293b", borderRadius: 10, padding: "12px 14px" }}>
                    <div style={{ fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>Kits ({adjustItem.vialsPerKit||1} ea.)</div>
                    <div style={{ fontSize: 26, fontWeight: 900, color: "#818cf8" }}>{adjustItem.vialsPerKit?(adjustItem.qtyVials/adjustItem.vialsPerKit).toFixed(1):"—"}</div>
                  </div>
                </div>
                <Field label="Action">
                  <div style={{ display: "flex", gap: 8 }}>
                    {["use","sell","restock"].map(m => (
                      <button key={m} onClick={() => setAdjustMode(m)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", fontSize: 13, fontWeight: 800, background: adjustMode===m?"#6366f1":"#1e293b", color: adjustMode===m?"#fff":"#475569", cursor: "pointer" }}>
                        {m==="restock"?"Restock":m==="use"?"Used":"Sold"}
                      </button>
                    ))}
                  </div>
                </Field>
                <Field label="By">
                  <div style={{ display: "flex", gap: 8 }}>
                    {["vial","kit"].map(u => (
                      <button key={u} onClick={() => { setAdjustUnit(u); setAdjustQty(1); }} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", fontSize: 13, fontWeight: 700, background: adjustUnit===u?"#0f4c75":"#1e293b", color: adjustUnit===u?"#7dd3fc":"#475569", cursor: "pointer" }}>
                        {u==="kit"?`Kit (${adjustItem.vialsPerKit||1} vials)`:"Single Vial"}
                      </button>
                    ))}
                  </div>
                </Field>
                <Field label={`Quantity (${adjustUnit==="kit"?"kits":"vials"})`}>
                  <input type="number" min="1" value={adjustQty} onChange={e => setAdjustQty(e.target.value)} style={inputStyle} />
                </Field>
                <div style={{ background: "#1e293b", borderRadius: 10, padding: "12px 16px", marginBottom: 16 }}>
                  {adjustMode!=="restock" ? (
                    <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
                      <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>Deducting</div><div style={{ fontSize: 18, fontWeight: 800, color: "#f87171" }}>{vialCount} vial{vialCount!==1?"s":""}</div></div>
                      <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>Remaining</div><div style={{ fontSize: 18, fontWeight: 800, color: "#6ee7b7" }}>{remaining} vials</div></div>
                      {adjustMode==="sell" && <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>Min Sell</div><div style={{ fontSize: 18, fontWeight: 800, color: "#a5b4fc" }}>${(adjustItem.costPerVial*vialCount).toFixed(2)}</div></div>}
                    </div>
                  ) : (
                    <div><div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>Adding</div><div style={{ fontSize: 18, fontWeight: 800, color: "#6ee7b7" }}>+{vialCount} vials → {adjustItem.qtyVials+vialCount} total</div></div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setShowAdjust(null)} style={{ flex: 1, background: "#1e293b", border: "1px solid #334155", color: "#64748b", borderRadius: 10, padding: "11px 0", fontSize: 14, cursor: "pointer" }}>Cancel</button>
                  <button onClick={handleAdjust} style={{ flex: 2, background: "#6366f1", color: "#fff", border: "none", borderRadius: 10, padding: "11px 0", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>Confirm</button>
                </div>
              </Modal>
            );
          })()}

          {/* Detail Modal */}
          {showDetail && detailItem && (
            <Modal title={`${detailItem.displayCompound}${detailItem.strength?` · ${detailItem.strength} ${detailItem.strengthUnit||"mg"}`:""}`} onClose={() => setShowDetail(null)}>
              <div style={{ marginBottom: 12 }}><CategoryPill name={tab.getCat(detailItem.displayCompound)||"Other"} /></div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
                {[
                  { label: "Vendor", val: detailItem.vendor||"—" },
                  { label: "Lot #", val: detailItem.lotNumber||"—" },
                  { label: "Kits", val: detailItem.kitsQty||1 },
                  { label: "Vials/Kit", val: detailItem.vialsPerKit||1 },
                  { label: "Total Vials", val: `${detailItem.qtyVials} / ${detailItem.originalQty}` },
                  { label: "Strength", val: detailItem.strength?`${detailItem.strength} ${detailItem.strengthUnit||"mg"}/vial`:"—" },
                  { label: "Price/Kit", val: `$${detailItem.costPerKit.toFixed(2)}` },
                  { label: "Subtotal", val: `$${(detailItem.costPerKit*(detailItem.kitsQty||1)).toFixed(2)}` },
                  { label: "Shipping", val: `$${detailItem.shipping.toFixed(2)}` },
                  { label: "Fees", val: `$${detailItem.fees.toFixed(2)}` },
                  { label: "Total Paid", val: `$${detailItem.totalCost.toFixed(2)}` },
                  { label: "Cost/Vial", val: `$${detailItem.costPerVial.toFixed(2)}` },
                  { label: `Cost/${detailItem.strengthUnit||"mg"}`, val: detailItem.costPerUnit?`$${detailItem.costPerUnit.toFixed(4)}`:"—" },
                  { label: "Overfill", val: detailItem.overfill||"Unknown" },
                  { label: `Actual ${detailItem.strengthUnit||"mg"}`, val: detailItem.actualStrength?`${detailItem.actualStrength} ${detailItem.strengthUnit||"mg"}`:"—" },
                ].map(r => (
                  <div key={r.label} style={{ background: "#1e293b", borderRadius: 8, padding: "10px 12px" }}>
                    <div style={{ fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>{r.label}</div>
                    <div style={{ fontSize: 14, fontWeight: 800, color: "#f1f5f9", marginTop: 2 }}>{r.val}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginBottom: 12 }}><div style={labelStyle}>COA Status</div><CoaBadges item={detailItem} /></div>
              {detailItem.coaLink && <div style={{ marginBottom: 12 }}><div style={labelStyle}>COA Link</div><a href={detailItem.coaLink} target="_blank" rel="noreferrer" style={{ color: "#818cf8", fontSize: 13, wordBreak: "break-all" }}>{detailItem.coaLink}</a></div>}
              {detailItem.notes && <div style={{ marginBottom: 12 }}><div style={labelStyle}>Notes</div><div style={{ fontSize: 14, color: "#cbd5e1", background: "#1e293b", borderRadius: 8, padding: "10px 12px" }}>{detailItem.notes}</div></div>}
              <div style={{ marginBottom: 16 }}>
                <div style={labelStyle}>Activity Log</div>
                <div style={{ background: "#1e293b", borderRadius: 8, padding: "10px 12px", display: "flex", flexDirection: "column", gap: 4, maxHeight: 120, overflowY: "auto" }}>
                  {(detailItem.log||[]).map((l,i) => <div key={i} style={{ fontSize: 12, color: "#475569" }}>· {l}</div>)}
                </div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => openEdit(detailItem)} style={{ flex: 1, background: "#1e293b", border: "1px solid #6366f1", color: "#a5b4fc", borderRadius: 10, padding: "10px 0", fontSize: 13, fontWeight: 800, cursor: "pointer" }}>✏️ Edit</button>
                <button onClick={() => { if(confirm("Delete this kit?")) { tab.setInventory(prev=>prev.filter(i=>i.id!==detailItem.id)); setShowDetail(null); } }} style={{ flex: 1, background: "none", border: "1px solid #7f1d1d", color: "#f87171", borderRadius: 10, padding: "10px 0", fontSize: 13, cursor: "pointer" }}>Delete</button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Service Worker for offline use -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'peptide-tracker-v1';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])));
          self.skipWaiting();
        });
        self.addEventListener('activate', e => { self.clients.claim(); });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./'))));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
