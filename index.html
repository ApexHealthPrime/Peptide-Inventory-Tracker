function norm(i){
  var cpk=parseFloat(i.cpk!==undefined?i.cpk:i.costPerKit)||0;
  var ship=parseFloat(i.ship!==undefined?i.ship:i.shipping)||0;
  var fees=parseFloat(i.fees)||0;
  var kits=parseInt(i.kits||i.kitsQty)||1;
  var vpk=parseInt(i.vpk||i.vialsPerKit)||10;
  var qv=parseInt(i.qtyVials)||(kits*vpk);
  var tot=parseFloat(i.totalCost)||((cpk*kits)+ship+fees);
  var cpv=parseFloat(i.cpv||i.costPerVial)||(qv>0?tot/qv:0);
  var str=i.strength!==undefined?i.strength:(i.mg!==undefined?i.mg:null);
  var strN=str!==null?parseFloat(str):null;
  var cpu=parseFloat(i.cpu||i.costPerUnit)||(strN&&cpv?cpv/strN:null)||null;
  return {id:uid(),displayCompound:i.displayCompound||i.compound||"",strength:strN,unit:i.unit||i.strengthUnit||"mg",vendor:i.vendor||"",lot:i.lot||i.lotNumber||"",kits:kits,vpk:vpk,qtyVials:qv,originalQty:parseInt(i.originalQty)||qv,cpk:cpk,ship:ship,fees:fees,totalCost:tot,cpv:cpv,cpu:cpu,mass:!!(i.mass!==undefined?i.mass:i.hasMass),purity:!!(i.purity!==undefined?i.purity:i.hasPurity),endo:!!(i.endo!==undefined?i.endo:i.hasEndotoxin),coa:i.coa||i.coaLink||"",overfill:i.overfill||"",actual:parseFloat(i.actual||i.actualStrength||i.actualMg)||null,notes:i.notes||"",dateAdded:i.dateAdded||TODAY,status:i.status||"On Hand",eta:i.eta||i.expectedDate||"",sales:i.sales||[],totalRevenue:parseFloat(i.totalRevenue)||0,totalProfit:parseFloat(i.totalProfit)||0,archived:!!i.archived,log:i.log||[]};
}

function load(){
  try{
    var r=localStorage.getItem("peptrack_v3");
    if(r){var d=JSON.parse(r);var all=(d.p||[]).concat(d.b||[]).concat(d.n||[]);return{inv:all.map(norm),dk:d.dk!==false};}
    var r2=localStorage.getItem("peptrack_v2")||localStorage.getItem("peptide_tracker_v1");
    if(r2){var d2=JSON.parse(r2);var all2=(d2.p||d2.peptides||[]).concat(d2.b||d2.blends||[]).concat(d2.n||d2.nonPeptides||[]);return{inv:all2.map(norm),dk:true};}
  }catch(e){}
  return{inv:[],dk:true};
}
function save(inv){try{localStorage.setItem("peptrack_v3",JSON.stringify({p:inv,b:[],n:[],dk:true}));}catch(e){}}

function CompoundSearch(props){
  var fd=props.fd;var initVal=props.initVal;
  var sq=useState(initVal||"");var query=sq[0];var setQuery=sq[1];
  var sopen=useState(false);var open=sopen[0];var setOpen=sopen[1];
