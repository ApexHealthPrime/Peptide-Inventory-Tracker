<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PepTrack" />
  <meta name="theme-color" content="#020817" />
  <title>PepTrack</title>
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22PepTrack%22%2C%22short_name%22%3A%22PepTrack%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020817%22%2C%22theme_color%22%3A%22%23020817%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%3D%270%200%20100%20100%2527%253E%253Crect%2520width%3D%2527100%2527%2520height%3D%2527100%2527%2520rx%3D%252720%2527%2520fill%3D%2527%23020817%2527%2F%253E%253Ctext%2520y%3D%2527.9em%2527%2520font-size%3D%252780%2527%253E%25F0%259F%25A7%25AA%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23020817'/><text y='.9em' font-size='80'>🧪</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, 'Inter', system-ui, sans-serif; transition: background 0.2s, color 0.2s; }
    input, select, textarea, button { font-family: inherit; }
    .safe-top { padding-top: max(18px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(60px, env(safe-area-inset-bottom)); }
    /* Night mode */
    body.night { background: #020817; color: #e2e8f0; }
    /* Day mode */
    body.day { background: #f1f5f9; color: #0f172a; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body class="night">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // ─── THEME ───────────────────────────────────────────────────────────────
    const NIGHT = {
      bg: "#020817", bg2: "#0a0f1e", bg3: "#0f172a", bg4: "#1e293b",
      border: "#1e293b", border2: "#334155",
      text: "#f8fafc", text2: "#e2e8f0", text3: "#94a3b8", text4: "#475569", text5: "#334155",
      inputBg: "#1e293b", inputBorder: "#334155",
      headerBg: "linear-gradient(135deg,#0f172a 0%,#1a1040 100%)",
      cardBg: "#0f172a", cardBg2: "#0a0f1e",
      accent: "#6366f1", accentText: "#a5b4fc",
      statColor: "#818cf8",
    };
    const DAY = {
      bg: "#f1f5f9", bg2: "#e2e8f0", bg3: "#ffffff", bg4: "#f8fafc",
      border: "#cbd5e1", border2: "#94a3b8",
      text: "#0f172a", text2: "#1e293b", text3: "#475569", text4: "#64748b", text5: "#94a3b8",
      inputBg: "#ffffff", inputBorder: "#cbd5e1",
      headerBg: "linear-gradient(135deg,#1e293b 0%,#312e81 100%)",
      cardBg: "#ffffff", cardBg2: "#f8fafc",
      accent: "#4f46e5", accentText: "#4f46e5",
      statColor: "#4f46e5",
    };

    // ─── DATA ────────────────────────────────────────────────────────────────
    const PEPTIDE_CATEGORIES = [
      { label: "GLP-1 / Metabolic", compounds: ["Retatrutide","Tirzepatide","Semaglutide","Liraglutide","Dulaglutide","Exenatide","Lixisenatide","Eloralintide","CB4211","Cagrilintide","CagriSema","VK2735","CT-388","MariTide (AMG-133)","Pemvidutide","Survodutide","Mazdutide","Efinopegdutide","Oxyntomodulin","Amylin","Pramlintide","Adropin"] },
      { label: "Growth Hormone / IGF-1", compounds: ["HGH (Somatropin)","Somapacitan","Lonapegsomatropin","Tesamorelin","CJC-1295","CJC-1295 DAC","Mod GRF 1-29","Sermorelin","Ipamorelin","GHRP-2","GHRP-6","Hexarelin","Alexamorelin","IGF-1 LR3","IGF-1 DES","PEG-MGF","MGF","Mecasermin","AOD-9604"] },
      { label: "Recovery & Regeneration", compounds: ["BPC-157","TB-500","Thymosin Beta-4","KPV","LL-37","ARA-290 (Cibinetide)","GHK-Cu","AHK-Cu","B7-33","FOXO4-DRI","TP508","P144","AP318","BPC-128","FX06"] },
      { label: "Mitochondrial & Longevity", compounds: ["MOTS-c","SS-31 (Elamipretide)","Humanin","SHLP-1","SHLP-2","SHLP-3","SHLP-4","SHLP-5","SHLP-6","Epithalon (Epitalon)","N-Acetyl Epitalon Amidate","Pinealon","Endoluten","Suprefort","Ventfort","Vladonix"] },
      { label: "Cosmetic & Dermatology", compounds: ["GHK-Cu","AHK-Cu","Melanotan I","Melanotan II","KTTKS (Matrixyl)","Pal-KTTKS","Copper Tripeptide-1"] },
      { label: "Hormonal / Reproductive", compounds: ["Kisspeptin-10","Kisspeptin-54","HCG","PT-141 (Bremelanotide)","Oxytocin","Carbetocin","Leuprolide","Triptorelin","Buserelin","Nafarelin","Deslorelin","Gonadorelin","GnRH","Vasopressin","Desmopressin","Terlipressin","Lypressin"] },
      { label: "Neurology / Cognitive / Sleep", compounds: ["Semax","NA-Semax Amidate","Selank","NA-Selank Amidate","Dihexa","P21","DSIP","PE-22-28","NAP (Davunetide)","Cerebrolysin","Cortagen","DDNSP","Retinalamin","Pinealon"] },
      { label: "Immune / Thymic", compounds: ["Thymosin Alpha-1 (TA-1)","Thymosin Beta-4","Thymalin","Thymogen","Thymulin","Thymopentin","TP5","TP508","Vilon","LL-37","KPV"] },
      { label: "Organ Bioregulators", compounds: ["Bronchogen","Cardiogen","Cartalax","Chonluten","Cortagen","Crystagen","Endoluten","Livagen","Ovargen","Pancregen","Prostamax","Prostatilen","Testagen","Vesilute","Vesugen","Vladonix","Ventfort","Suprefort"] },
      { label: "Muscle & Performance", compounds: ["Follistatin-344","Follistatin-315","ACE-031","Myostatin Propeptide","Activin Receptor Peptides"] },
      { label: "Therapeutic Peptide Drugs", compounds: ["Insulin","Insulin Lispro","Insulin Aspart","Insulin Glargine","Insulin Degludec","Glucagon","Pramlintide","Calcitonin","Teriparatide","Abaloparatide","Secretin","VIP","Cholecystokinin (CCK)","Motilin","GLP-2","Teduglutide","BNP","Nesiritide","Relaxin-2","Apelin","Angiotensin-(1-7)","Somatostatin analogs","Desmopressin (DDAVP)"] },
      { label: "Oncology / Targeted Therapy", compounds: ["LTX-315","PNC-27","PNC-28","BT1718","CEND-1","Melflufen","Lutetium-177 DOTATATE","Neoantigen peptide vaccines","Melittin-derived peptides","Cecropin-derived peptides"] },
      { label: "Antimicrobial", compounds: ["LL-37","Omiganan","Pexiganan","Histatin","Lactoferricin","Defensins","Cathelicidins","RTD-1"] },
      { label: "Research Materials / Biomaterials", compounds: ["FEFKFEFK hydrogel","Peptide-graphene oxide hydrogels","RGD peptides","AP39","AP123","NDX-1017","CN-105","C16","AXT107","P140 (Lupuzor)","GEPP44","PEP20","XPro1595","BT200","ZP1849","AZP-3813","CB5138"] },
      { label: "Other", compounds: ["Other"] },
    ];
    const BLEND_COMPOUNDS = ["KLOW","GLOW","Wolverine","Other"];
    const BLEND_FORMULAS = { "KLOW":"GHK-Cu + KPV + BPC-157 + TB-500","GLOW":"GHK-Cu + BPC-157 + TB-500","Wolverine":"BPC-157 + TB-500" };
    const NONPEPTIDE_CATEGORIES = [
      { label: "NAD+ Pathway", compounds: ["NAD+","NMN","NR (Nicotinamide Riboside)"] },
      { label: "Mitochondrial / Metabolic", compounds: ["5-Amino-1MQ","SLU-PP-332","Urolithin A","CoQ10","BAM15","MK-677","SR9009","Cardarine (GW-501516)"] },
      { label: "Other Small Molecules", compounds: ["Other"] },
    ];
    const MG_OPTIONS = [0.5,1,2,2.5,4,5,6,7.5,10,15,20,30,50];
    const STRENGTH_UNITS = ["mg","IU","mcg","units"];
    const TODAY = new Date().toISOString().split("T")[0];
    const STATUSES = ["On Hand","Ordered","In Transit"];
    const STATUS_STYLE = {
      "On Hand":    { bg:"#052e16", color:"#86efac", border:"" },
      "Ordered":    { bg:"#431407", color:"#fdba74", border:"#f97316" },
      "In Transit": { bg:"#422006", color:"#fcd34d", border:"#eab308" },
    };
    const CATEGORY_COLORS = {
      "GLP-1 / Metabolic":"#6366f1","Growth Hormone / IGF-1":"#0ea5e9",
      "Recovery & Regeneration":"#10b981","Mitochondrial & Longevity":"#f59e0b",
      "Cosmetic & Dermatology":"#ec4899","Hormonal / Reproductive":"#a78bfa",
      "Neurology / Cognitive / Sleep":"#38bdf8","Immune / Thymic":"#34d399",
      "Organ Bioregulators":"#fb923c","Muscle & Performance":"#f87171",
      "Therapeutic Peptide Drugs":"#94a3b8","Oncology / Targeted Therapy":"#e879f9",
      "Antimicrobial":"#4ade80","Research Materials / Biomaterials":"#fbbf24",
      "Blends":"#a3e635","Non-Peptides":"#67e8f9","Other":"#64748b",
    };
    function getCategoryForCompound(n,cats){for(const c of cats){if(c.compounds.includes(n))return c.label;}return null;}
    function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);}

    // ─── PERSISTENCE ─────────────────────────────────────────────────────────
    function loadState(){
      try{
        const raw=localStorage.getItem("peptide_tracker_v1");
        if(raw){
          const data=JSON.parse(raw);
          const reId=arr=>(arr||[]).map(item=>({...item,id:uid()}));
          return{peptides:reId(data.peptides),blends:reId(data.blends),nonPeptides:reId(data.nonPeptides),darkMode:data.darkMode!==undefined?data.darkMode:true};
        }
      }catch{}
      return{peptides:[],blends:[],nonPeptides:[],darkMode:true};
    }
    function saveState(data){try{localStorage.setItem("peptide_tracker_v1",JSON.stringify(data));}catch{}}

    const emptyForm={
      compound:"",customCompound:"",strength:"",customStrength:"",strengthUnit:"mg",
      vendor:"",lotNumber:"",kitsQty:1,vialsPerKit:10,
      costPerKit:"",shipping:"",fees:"",
      hasMass:false,hasPurity:false,hasEndotoxin:false,
      coaLink:"",overfill:"",actualStrength:"",notes:"",
      purchaseDate:TODAY,status:"On Hand",expectedDate:"",
    };
    function calcTotal(f){const k=parseInt(f.kitsQty)||1;return((parseFloat(f.costPerKit)||0)*k)+(parseFloat(f.shipping)||0)+(parseFloat(f.fees)||0);}
    function calcVials(f){return(parseInt(f.kitsQty)||1)*(parseInt(f.vialsPerKit)||10);}

    // ─── THEME-AWARE STYLES ───────────────────────────────────────────────────
    function useStyles(dark){
      const T=dark?NIGHT:DAY;
      const input={background:T.inputBg,border:`1px solid ${T.inputBorder}`,borderRadius:8,color:T.text,padding:"8px 12px",fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",colorScheme:dark?"dark":"light"};
      const label={fontSize:11,color:T.text4,marginBottom:4,display:"block",fontWeight:700,letterSpacing:0.5,textTransform:"uppercase"};
      return{T,input,label};
    }

    // ─── SMALL COMPONENTS ─────────────────────────────────────────────────────
    function Badge({children,bg,color}){return<span style={{background:bg||"#1e293b",color:color||"#94a3b8",padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700,whiteSpace:"nowrap",display:"inline-block"}}>{children}</span>;}

    function StatusBadge({status}){
      const s=STATUS_STYLE[status]||STATUS_STYLE["On Hand"];
      return<span style={{background:s.bg,color:s.color,padding:"2px 9px",borderRadius:12,fontSize:11,fontWeight:800,whiteSpace:"nowrap"}}>{status}</span>;
    }

    function CoaBadges({item}){
      return<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        <Badge bg={item.hasMass?"#064e3b":"#1e293b"} color={item.hasMass?"#6ee7b7":"#475569"}>Mass {item.hasMass?"✓":"✗"}</Badge>
        <Badge bg={item.hasPurity?"#064e3b":"#1e293b"} color={item.hasPurity?"#6ee7b7":"#475569"}>Purity {item.hasPurity?"✓":"✗"}</Badge>
        <Badge bg={item.hasEndotoxin?"#064e3b":"#1e293b"} color={item.hasEndotoxin?"#6ee7b7":"#475569"}>Endotoxin {item.hasEndotoxin?"✓":"✗"}</Badge>
      </div>;
    }

    function StockBadge({qty,status}){
      if(status!=="On Hand")return null;
      if(qty===0)return<Badge bg="#450a0a" color="#fca5a5">Out of Stock</Badge>;
      if(qty<=2)return<Badge bg="#422006" color="#fcd34d">Low — {qty}</Badge>;
      return<Badge bg="#052e16" color="#86efac">In Stock ({qty})</Badge>;
    }

    function CategoryPill({name}){
      const color=CATEGORY_COLORS[name]||"#64748b";
      return<span style={{fontSize:10,fontWeight:700,color,background:color+"22",padding:"2px 7px",borderRadius:8,whiteSpace:"nowrap"}}>{name}</span>;
    }

    function Modal({title,onClose,children,dark}){
      const{T}=useStyles(dark);
      return<div style={{position:"fixed",inset:0,background:"rgba(2,8,23,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:18,padding:24,width:"100%",maxWidth:600,maxHeight:"92vh",overflowY:"auto",color:T.text}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <h2 style={{margin:0,fontSize:17,color:T.text,fontWeight:800}}>{title}</h2>
            <button onClick={onClose} style={{background:"none",border:"none",color:T.text4,fontSize:24,cursor:"pointer"}}>×</button>
          </div>
          {children}
        </div>
      </div>;
    }

    function CompoundSelect({value,onChange,categories,dark}){
      const{T,input}=useStyles(dark);
      const[query,setQuery]=useState("");
      const[open,setOpen]=useState(false);
      const ref=useRef(null);
      const all=categories.flatMap(cat=>cat.compounds.map(c=>({name:c,cat:cat.label})));
      const filtered=query.length>0?all.filter(c=>c.name.toLowerCase().includes(query.toLowerCase())).slice(0,14):[];
      useEffect(()=>{function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
      function select(name){onChange(name);setQuery(name==="Other"?"":name);setOpen(false);}
      const displayValue=value&&value!=="Other"?value:query;
      return<div ref={ref} style={{position:"relative"}}>
        <input value={displayValue} onChange={e=>{setQuery(e.target.value);onChange("");setOpen(true);}} onFocus={()=>setOpen(true)} placeholder="Type to search or browse…" style={{...input,paddingRight:32}} autoComplete="off" />
        {displayValue&&<button onClick={()=>{onChange("");setQuery("");setOpen(false);}} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:T.text4,fontSize:18,cursor:"pointer",padding:0}}>×</button>}
        {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:300,background:T.bg3,border:`1px solid ${T.border2}`,borderRadius:10,maxHeight:300,overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.4)"}}>
          {query.length===0?categories.map(cat=><div key={cat.label}>
            <div style={{padding:"5px 12px 3px",fontSize:10,color:CATEGORY_COLORS[cat.label]||"#6366f1",fontWeight:800,letterSpacing:1,textTransform:"uppercase",background:T.bg2,position:"sticky",top:0}}>{cat.label}</div>
            {cat.compounds.map(c=><div key={c} onClick={()=>select(c)} style={{padding:"8px 16px",fontSize:13,color:T.text2,cursor:"pointer",borderBottom:`1px solid ${T.border}`}} onMouseEnter={e=>e.currentTarget.style.background=T.bg4} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>{c}</div>)}
          </div>):filtered.length>0?filtered.map(({name,cat})=><div key={name} onClick={()=>select(name)} style={{padding:"9px 16px",fontSize:13,color:T.text2,cursor:"pointer",borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}} onMouseEnter={e=>e.currentTarget.style.background=T.bg4} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <span>{name}</span><span style={{fontSize:10,color:CATEGORY_COLORS[cat]||T.text4,fontWeight:700}}>{cat}</span>
          </div>):<div>
            <div style={{padding:"10px 16px",fontSize:13,color:T.text4}}>No match found</div>
            <div onClick={()=>{onChange("Other");setOpen(false);}} style={{padding:"9px 16px",fontSize:13,color:T.accentText,cursor:"pointer",borderTop:`1px solid ${T.border}`}} onMouseEnter={e=>e.currentTarget.style.background=T.bg4} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>+ Add as custom compound</div>
          </div>}
        </div>}
      </div>;
    }

    function Field({label:lbl,children,span,T,labelStyle}){
      return<div style={{marginBottom:14,gridColumn:span?"1/-1":undefined}}>
        <label style={labelStyle||{fontSize:11,color:T.text4,marginBottom:4,display:"block",fontWeight:700,letterSpacing:0.5,textTransform:"uppercase"}}>{lbl}</label>
        {children}
      </div>;
    }
    function CheckBox({checked,onChange,label,T}){
      return<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:T.text2}}>
        <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} style={{width:15,height:15,accentColor:"#6366f1"}} />{label}
      </label>;
    }

    // ─── KIT FORM ─────────────────────────────────────────────────────────────
    // Stable text input that never loses focus on re-render
    const StableInput = React.memo(function StableInput({value, onChange, style, placeholder, type, inputMode, autoFocus, min}) {
      const [local, setLocal] = useState(value || "");
      const ref = useRef(null);
      // sync local when parent value changes from outside (e.g. form reset)
      useEffect(() => { setLocal(value || ""); }, [value]);
      return <input
        ref={ref}
        type={type||"text"}
        inputMode={inputMode}
        min={min}
        autoFocus={autoFocus}
        value={local}
        placeholder={placeholder}
        style={style}
        onChange={e => {
          setLocal(e.target.value);
          onChange(e.target.value);
        }}
      />;
    });

    const StableTextarea = React.memo(function StableTextarea({value, onChange, style, placeholder}) {
      const [local, setLocal] = useState(value || "");
      useEffect(() => { setLocal(value || ""); }, [value]);
      return <textarea
        value={local}
        placeholder={placeholder}
        style={style}
        onChange={e => { setLocal(e.target.value); onChange(e.target.value); }}
      />;
    });

    function KitForm({form,setF,categories,dark}){
      const{T,input,label}=useStyles(dark);
      const total=calcTotal(form);
      const totalVials=calcVials(form);
      const perVial=totalVials>0?total/totalVials:0;
      const strVal=form.strength==="custom"?parseFloat(form.customStrength):parseFloat(form.strength);
      const costPerUnit=(strVal&&perVial)?perVial/strVal:null;
      const unitLabel=form.strengthUnit||"mg";
      const FLD=({lbl,children,span})=><Field label={lbl} span={span} T={T} labelStyle={label}>{children}</Field>;
      const inp=(props)=><input style={input} {...props}/>;
      return<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
        <FLD lbl="Compound" span>
          <CompoundSelect value={form.compound} onChange={v=>setF("compound",v)} categories={categories} dark={dark}/>
        </FLD>
        {form.compound==="Other"&&<FLD lbl="Compound Name" span><StableInput value={form.customCompound} onChange={v=>setF("customCompound",v)} style={input} placeholder="Enter name…"/></FLD>}

        <FLD lbl="Strength (per vial)">
          <div style={{display:"flex",gap:6}}>
            <select value={form.strength} onChange={e=>setF("strength",e.target.value)} style={{...input,flex:2}}>
              <option value="">Select…</option>
              {MG_OPTIONS.map(m=><option key={m} value={m}>{m}</option>)}
              <option value="custom">Custom</option>
            </select>
            <select value={form.strengthUnit} onChange={e=>setF("strengthUnit",e.target.value)} style={{...input,flex:1}}>
              {STRENGTH_UNITS.map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
        </FLD>
        {form.strength==="custom"?<FLD lbl="Custom amount"><StableInput value={form.customStrength} onChange={v=>{if(v===""||v==="."||/^\d*\.?\d*$/.test(v))setF("customStrength",v);}} style={input} placeholder="e.g. 8.5" autoFocus/></FLD>:<div/>}

        <FLD lbl="Vendor"><StableInput value={form.vendor} onChange={v=>setF("vendor",v)} style={input} placeholder="e.g. WWB"/></FLD>
        <FLD lbl="Lot / Batch #"><StableInput value={form.lotNumber} onChange={v=>setF("lotNumber",v)} style={input} placeholder="Optional"/></FLD>

        <FLD lbl="Status">
          <select value={form.status} onChange={e=>setF("status",e.target.value)} style={input}>
            {STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </FLD>
        <FLD lbl="Expected Date (if ordered)">
          {inp({type:"date",value:form.expectedDate,onChange:e=>setF("expectedDate",e.target.value)})}
        </FLD>

        <FLD lbl="Kits Purchased"><StableInput type="number" min="1" value={String(form.kitsQty)} onChange={v=>setF("kitsQty",v)} style={input}/></FLD>
        <FLD lbl="Vials per Kit"><StableInput type="number" min="1" value={String(form.vialsPerKit)} onChange={v=>setF("vialsPerKit",v)} style={input}/></FLD>
        <FLD lbl="Cost per Kit ($)"><StableInput type="number" value={String(form.costPerKit)} onChange={v=>setF("costPerKit",v)} style={input} placeholder="0.00"/></FLD>
        <FLD lbl="Shipping ($)"><StableInput type="number" value={String(form.shipping)} onChange={v=>setF("shipping",v)} style={input} placeholder="0.00"/></FLD>

      const[open,setOpen]=useState(false);

      const minCPU=cpuItems.length?cpuItems.reduce((mn,i)=>Math.min(mn,i.costPerUnit),Infinity):null;

        <div onClick={()=>!forceOpen&&setOpen(o=>!o)} style={{padding:"13px 16px",cursor:forceOpen?"default":"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>

            <span style={{fontSize:11,color:T.text4}}>{items.length} kit{items.length!==1?"s":""}</span>
            <Badge bg="#052e16" color="#86efac">{totalOnHand} on hand</Badge>
            {totalOrdered>0&&<Badge bg="#431407" color="#fdba74">{totalOrdered} on order</Badge>}
            <div style={{display:"flex",gap:3}}>
              <span style={{background:hasAnyMass?"#064e3b":"#1e293b",color:hasAnyMass?"#6ee7b7":"#334155",padding:"1px 6px",borderRadius:8,fontSize:10,fontWeight:700}}>M{hasAnyMass?"✓":"✗"}</span>
              <span style={{background:hasAnyPurity?"#064e3b":"#1e293b",color:hasAnyPurity?"#6ee7b7":"#334155",padding:"1px 6px",borderRadius:8,fontSize:10,fontWeight:700}}>P{hasAnyPurity?"✓":"✗"}</span>
              <span style={{background:hasAnyEndotoxin?"#064e3b":"#1e293b",color:hasAnyEndotoxin?"#6ee7b7":"#334155",padding:"1px 6px",borderRadius:8,fontSize:10,fontWeight:700}}>E{hasAnyEndotoxin?"✓":"✗"}</span>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:15,fontWeight:900,color:"#a5b4fc"}}>${totalCost.toFixed(2)}</div>
              {minCPU&&<div style={{fontSize:10,color:"#fbbf24"}}>${minCPU.toFixed(4)}–${maxCPU.toFixed(4)}/{items[0]?.strengthUnit||"mg"}</div>}

          </div>

        {isOpen&&<div style={{borderTop:`1px solid ${T.border}`,padding:"10px 12px",display:"flex",flexDirection:"column",gap:6}}>

    // ─── GROUPED INVENTORY ────────────────────────────────────────────────────
    function GroupedInventory({items,categories,onDetail,onAdjust,onReceive,getCat,filterActive,dark}){

        const map={};
        for(const item of items){const cat=getCat(item.displayCompound)||"Other";if(!map[cat])map[cat]={};if(!map[cat][item.displayCompound])map[cat][item.displayCompound]=[];map[cat][item.displayCompound].push(item);}
        return map;
      },[items,getCat]);
      const orderedCats=[...categories.map(c=>c.label),"Other"].filter(c=>byCat[c]);
      if(items.length===0)return<div style={{textAlign:"center",color:T.text4,padding:"60px 0",fontSize:15}}>No items yet — add your first one above.</div>;
      return<div>
        {orderedCats.map(cat=><div key={cat} style={{marginBottom:24}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App(){
      const initial=loadState();
      const[dark,setDark]=useState(initial.darkMode!==undefined?initial.darkMode:true);
      const[peptides,setPeptides]=useState(initial.peptides||[]);
      const[blends,setBlends]=useState(initial.blends||[]);
      const[nonPeptides,setNonPeptides]=useState(initial.nonPeptides||[]);
      const[activeTab,setActiveTab]=useState("peptides");
      const[showAdd,setShowAdd]=useState(false);
      const[showEdit,setShowEdit]=useState(null);
      const[showDetail,setShowDetail]=useState(null);
      const[showAdjust,setShowAdjust]=useState(null);
      const[adjustMode,setAdjustMode]=useState("use");
      const[adjustQty,setAdjustQty]=useState(1);
      const[adjustUnit,setAdjustUnit]=useState("vial");
      const[form,setForm]=useState(emptyForm);
      const[filterVendor,setFilterVendor]=useState("All");
      const[filterCompound,setFilterCompound]=useState("All");
      const[filterStock,setFilterStock]=useState("All");
      const[filterStatus,setFilterStatus]=useState("All");
      const{T,input}=useStyles(dark);
      const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

      // Apply theme to body
      useEffect(()=>{document.body.className=dark?"night":"day";},[dark]);
      // Save state
      useEffect(()=>{saveState({peptides,blends,nonPeptides,darkMode:dark});},[peptides,blends,nonPeptides,dark]);

      const tabConfig={
        peptides:{label:"Peptides",inventory:peptides,setInventory:setPeptides,categories:PEPTIDE_CATEGORIES,getCat:n=>getCategoryForCompound(n,PEPTIDE_CATEGORIES)},
        blends:{label:"Blends",inventory:blends,setInventory:setBlends,categories:[{label:"Blends",compounds:BLEND_COMPOUNDS}],getCat:()=>"Blends"},
        nonpeptides:{label:"Non-Peptides",inventory:nonPeptides,setInventory:setNonPeptides,categories:NONPEPTIDE_CATEGORIES,getCat:n=>getCategoryForCompound(n,NONPEPTIDE_CATEGORIES)||"Other"},
      };
      const tab=tabConfig[activeTab];

      const vendors=useMemo(()=>["All",...new Set(tab.inventory.map(i=>i.vendor).filter(Boolean))],[tab.inventory]);
      const compounds=useMemo(()=>["All",...[...new Set(tab.inventory.map(i=>i.displayCompound).filter(Boolean))].sort()],[tab.inventory]);
      const filtered=useMemo(()=>tab.inventory.filter(i=>{
        if(filterVendor!=="All"&&i.vendor!==filterVendor)return false;
        if(filterCompound!=="All"&&i.displayCompound!==filterCompound)return false;
        if(filterStock==="In Stock"&&!(i.qtyVials>2&&(i.status||"On Hand")==="On Hand"))return false;
        if(filterStock==="Low"&&!(i.qtyVials>0&&i.qtyVials<=2&&(i.status||"On Hand")==="On Hand"))return false;
        if(filterStock==="Out of Stock"&&!(i.qtyVials===0&&(i.status||"On Hand")==="On Hand"))return false;
        if(filterStatus!=="All"&&(i.status||"On Hand")!==filterStatus)return false;
        return true;
      }),[tab.inventory,filterVendor,filterCompound,filterStock,filterStatus]);

      const allItems=[...peptides,...blends,...nonPeptides];
      const totalInvested=allItems.reduce((s,i)=>s+i.totalCost,0);
      const totalOnHand=allItems.filter(i=>(i.status||"On Hand")==="On Hand").reduce((s,i)=>s+i.qtyVials,0);
      const totalOrdered=allItems.filter(i=>i.status==="Ordered"||i.status==="In Transit").reduce((s,i)=>s+i.qtyVials,0);

      function buildItem(f,id){
        const displayCompound=f.compound==="Other"?f.customCompound:f.compound;
        const strVal=f.strength==="custom"?parseFloat(f.customStrength):parseFloat(f.strength);
        const total=calcTotal(f);
        const kits=parseInt(f.kitsQty)||1;
        const vpk=parseInt(f.vialsPerKit)||10;
        const totalVials=kits*vpk;
        const cpv=totalVials>0?total/totalVials:total;
        const cpu=(strVal&&cpv)?cpv/strVal:null;
        return{id,displayCompound,strength:strVal||null,strengthUnit:f.strengthUnit||"mg",vendor:f.vendor,lotNumber:f.lotNumber,kitsQty:kits,vialsPerKit:vpk,qtyVials:totalVials,originalQty:totalVials,costPerKit:parseFloat(f.costPerKit)||0,shipping:parseFloat(f.shipping)||0,fees:parseFloat(f.fees)||0,totalCost:total,costPerVial:cpv,costPerUnit:cpu,hasMass:f.hasMass,hasPurity:f.hasPurity,hasEndotoxin:f.hasEndotoxin,coaLink:f.coaLink,overfill:f.overfill,actualStrength:parseFloat(f.actualStrength)||null,notes:f.notes,dateAdded:f.purchaseDate||TODAY,status:f.status||"On Hand",expectedDate:f.expectedDate||"",log:[`Added ${kits} kit${kits>1?"s":""} (${totalVials} vials) — ${f.status||"On Hand"} — ${f.purchaseDate||TODAY}`]};
      }

      function handleAdd(){tab.setInventory(prev=>[...prev,buildItem(form,uid())]);setForm(emptyForm);setShowAdd(false);}

      function openEdit(item){
        setForm({compound:tab.categories.flatMap(c=>c.compounds).includes(item.displayCompound)?item.displayCompound:"Other",customCompound:tab.categories.flatMap(c=>c.compounds).includes(item.displayCompound)?"":item.displayCompound,strength:MG_OPTIONS.includes(item.strength)?String(item.strength):item.strength?"custom":"",customStrength:MG_OPTIONS.includes(item.strength)?"":item.strength?String(item.strength):"",strengthUnit:item.strengthUnit||"mg",vendor:item.vendor||"",lotNumber:item.lotNumber||"",kitsQty:item.kitsQty||1,vialsPerKit:item.vialsPerKit||10,costPerKit:item.costPerKit||"",shipping:item.shipping||"",fees:item.fees||"",hasMass:item.hasMass||false,hasPurity:item.hasPurity||false,hasEndotoxin:item.hasEndotoxin||false,coaLink:item.coaLink||"",overfill:item.overfill||"",actualStrength:item.actualStrength||"",notes:item.notes||"",purchaseDate:item.dateAdded||TODAY,status:item.status||"On Hand",expectedDate:item.expectedDate||""});
        setShowEdit(item.id);setShowDetail(null);
      }

      function handleSaveEdit(){
        const displayCompound=form.compound==="Other"?form.customCompound:form.compound;
        const strVal=form.strength==="custom"?parseFloat(form.customStrength):parseFloat(form.strength);
        const total=calcTotal(form);
        const kits=parseInt(form.kitsQty)||1;
        const vpk=parseInt(form.vialsPerKit)||10;
        const totalVials=kits*vpk;
        tab.setInventory(prev=>prev.map(item=>{
          if(item.id!==showEdit)return item;
          const cpv=totalVials>0?total/totalVials:total;
          const cpu=(strVal&&cpv)?cpv/strVal:null;
          return{...item,displayCompound,strength:strVal||null,strengthUnit:form.strengthUnit||"mg",vendor:form.vendor,lotNumber:form.lotNumber,kitsQty:kits,vialsPerKit:vpk,originalQty:totalVials,costPerKit:parseFloat(form.costPerKit)||0,shipping:parseFloat(form.shipping)||0,fees:parseFloat(form.fees)||0,totalCost:total,costPerVial:cpv,costPerUnit:cpu,hasMass:form.hasMass,hasPurity:form.hasPurity,hasEndotoxin:form.hasEndotoxin,coaLink:form.coaLink,overfill:form.overfill,actualStrength:parseFloat(form.actualStrength)||null,notes:form.notes,dateAdded:form.purchaseDate||item.dateAdded,status:form.status||"On Hand",expectedDate:form.expectedDate||"",log:[...(item.log||[]),`Edited on ${new Date().toLocaleDateString()}`]};
        }));
        setShowEdit(null);setForm(emptyForm);
      }

      function handleReceive(id){
        tab.setInventory(prev=>prev.map(item=>{
          if(item.id!==id)return item;
          return{...item,status:"On Hand",expectedDate:"",log:[...(item.log||[]),`Marked as Received on ${new Date().toLocaleDateString()}`]};
        }));
      }

      function openAdjust(id,mode){setShowAdjust(id);setAdjustMode(mode);setAdjustQty(1);setAdjustUnit("vial");}

      function handleAdjust(){
        const qty=parseInt(adjustQty)||1;
        tab.setInventory(prev=>prev.map(item=>{
          if(item.id!==showAdjust)return item;
          const vc=adjustUnit==="kit"?qty*(item.vialsPerKit||1):qty;
          const delta=adjustMode==="restock"?vc:-vc;
          const newQty=Math.max(0,item.qtyVials+delta);
          const lbl=adjustUnit==="kit"?`${qty} kit${qty>1?"s":""} (${vc} vials)`:`${vc} vial${vc>1?"s":""}`;
          const action=adjustMode==="restock"?`Restocked +${lbl}`:adjustMode==="sell"?`Sold ${lbl}`:`Used ${lbl}`;
          return{...item,qtyVials:newQty,log:[...(item.log||[]),`${action} on ${new Date().toLocaleDateString()} → ${newQty} remaining`]};
        }));
        setShowAdjust(null);
      }

      function handleExport(){
        const data={peptides,blends,nonPeptides,exportedAt:new Date().toISOString(),version:1};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");a.href=url;a.download=`peptide-inventory-${TODAY}.json`;a.click();URL.revokeObjectURL(url);
      }

      function handleImport(e){
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=evt=>{
          try{
            const data=JSON.parse(evt.target.result);
            const reId=arr=>(arr||[]).map(item=>({...item,id:uid()}));
            if(data.peptides)setPeptides(reId(data.peptides));
            if(data.blends)setBlends(reId(data.blends));
            if(data.nonPeptides)setNonPeptides(reId(data.nonPeptides));
            alert(`✅ Imported ${(data.peptides||[]).length+(data.blends||[]).length+(data.nonPeptides||[]).length} kits!`);
          }catch{alert("Invalid file.");}
        };
        reader.readAsText(file);e.target.value="";
      }

      const allInvs=[...peptides,...blends,...nonPeptides];
      const detailItem=allInvs.find(i=>i.id===showDetail);
      const adjustItem=allInvs.find(i=>i.id===showAdjust);
      const editItem=allInvs.find(i=>i.id===showEdit);
      const TABS=["peptides","blends","nonpeptides"];
      const TAB_LABELS={peptides:"Peptides",blends:"Blends",nonpeptides:"Non-Peptides"};
      const filterActive=filterVendor!=="All"||filterCompound!=="All"||filterStock!=="All"||filterStatus!=="All";
      const labelStyle={fontSize:11,color:T.text4,marginBottom:4,display:"block",fontWeight:700,letterSpacing:0.5,textTransform:"uppercase"};

      return<div style={{minHeight:"100vh",background:T.bg,color:T.text}} className="safe-bottom">
        {/* Header */}
        <div style={{background:T.headerBg,borderBottom:`1px solid ${T.border}`,padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}} className="safe-top">
          <div>
            <div style={{display:"flex",alignItems:"baseline",gap:0,marginBottom:2}}>
              <span style={{fontSize:28,fontWeight:900,background:"linear-gradient(135deg,#6366f1,#a78bfa,#38bdf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",letterSpacing:-1}}>Pep</span><span style={{fontSize:28,fontWeight:900,background:"linear-gradient(135deg,#38bdf8,#6ee7b7)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",letterSpacing:-1}}>Track</span><span style={{fontSize:11,color:"#6366f1",fontWeight:800,letterSpacing:3,marginLeft:6,alignSelf:"center"}}>PRO</span>
            </div>
            <div style={{fontSize:10,color:"#475569",marginTop:1}}>by <a href="https://t.me/JESCO831" target="_blank" rel="noreferrer" style={{color:"#6366f1",fontWeight:700,textDecoration:"none"}}>TG @JESCO831</a></div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{fontSize:12,color:"#94a3b8",textAlign:"right"}}>
              <span style={{color:"#a5b4fc",fontWeight:800}}>${totalInvested.toFixed(2)}</span>
              <div style={{fontSize:10}}><span style={{color:"#86efac"}}>{totalOnHand} on hand</span>{totalOrdered>0&&<span style={{color:"#fdba74"}}> · {totalOrdered} on order</span>}</div>
            </div>
            {/* Day/Night toggle */}
            <button onClick={()=>setDark(d=>!d)} title={dark?"Switch to Day Mode":"Switch to Night Mode"}
              style={{background:dark?"#1e293b":"rgba(255,255,255,0.15)",border:`1px solid ${dark?"#334155":"rgba(255,255,255,0.3)"}`,borderRadius:20,padding:"6px 12px",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",gap:4,color:dark?"#fbbf24":"#fde68a",transition:"all 0.2s"}}>
              {dark?"☀️":"🌙"}<span style={{fontSize:11,color:dark?"#94a3b8":"rgba(255,255,255,0.7)",fontWeight:600}}>{dark?"Day":"Night"}</span>
            </button>
            <label style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:10,padding:"7px 11px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              ⬆ Import<input type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
            </label>
            <button onClick={handleExport} style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:10,padding:"7px 11px",fontSize:12,fontWeight:700,cursor:"pointer"}}>⬇ Export</button>
            <button onClick={()=>{setForm(emptyForm);setShowAdd(true);}} style={{background:"#6366f1",color:"#fff",border:"none",borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:800,cursor:"pointer"}}>+ Add</button>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",borderBottom:`1px solid ${T.border}`,background:T.bg2}}>
          {TABS.map(t=><button key={t} onClick={()=>{setActiveTab(t);setFilterVendor("All");setFilterCompound("All");setFilterStock("All");setFilterStatus("All");}}
            style={{background:"none",border:"none",borderBottom:activeTab===t?"2px solid #6366f1":"2px solid transparent",color:activeTab===t?"#a5b4fc":T.text4,padding:"11px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
            {TAB_LABELS[t]} <span style={{marginLeft:4,background:activeTab===t?"#6366f133":T.bg4,color:activeTab===t?"#818cf8":T.text5,borderRadius:10,padding:"1px 6px",fontSize:11,fontWeight:800}}>{tabConfig[t].inventory.length}</span>
          </button>)}
        </div>

        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",background:T.bg2,borderBottom:`1px solid ${T.border}`}}>
          {[{label:"Kits",val:tab.inventory.length},{label:"On Hand",val:tab.inventory.filter(i=>(i.status||"On Hand")==="On Hand").reduce((s,i)=>s+i.qtyVials,0)},{label:"On Order",val:tab.inventory.filter(i=>i.status==="Ordered"||i.status==="In Transit").length},{label:"Invested",val:`$${tab.inventory.reduce((s,i)=>s+i.totalCost,0).toFixed(0)}`}].map(s=><div key={s.label} style={{padding:"10px 12px",borderRight:`1px solid ${T.border}`}}>
            <div style={{fontSize:10,color:T.text5,fontWeight:800,textTransform:"uppercase"}}>{s.label}</div>
            <div style={{fontSize:18,fontWeight:900,color:T.statColor,marginTop:1}}>{s.val}</div>
          </div>)}
        </div>

        {/* Filters */}
        <div style={{padding:"10px 14px",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",borderBottom:`1px solid ${T.border}`,background:T.bg2}}>
          {[{lbl:"VENDOR",val:filterVendor,set:setFilterVendor,opts:vendors},{lbl:"COMPOUND",val:filterCompound,set:setFilterCompound,opts:compounds},{lbl:"STOCK",val:filterStock,set:setFilterStock,opts:["All","In Stock","Low","Out of Stock"]},{lbl:"STATUS",val:filterStatus,set:setFilterStatus,opts:["All",...STATUSES]}].map(f=><div key={f.lbl} style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:9,color:T.text5,fontWeight:800,letterSpacing:1}}>{f.lbl}</span>
            <select value={f.val} onChange={e=>f.set(e.target.value)} style={{...input,width:"auto",fontSize:12,padding:"5px 8px"}}>{f.opts.map(o=><option key={o}>{o}</option>)}</select>
          </div>)}
          {filterActive&&<button onClick={()=>{setFilterVendor("All");setFilterCompound("All");setFilterStock("All");setFilterStatus("All");}} style={{background:"none",border:`1px solid ${T.border2}`,color:T.text4,borderRadius:7,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>Clear all</button>}
          {filtered.length!==tab.inventory.length&&<span style={{fontSize:11,color:T.text4}}>Showing {filtered.length} of {tab.inventory.length}</span>}
        </div>

        {/* Inventory */}
        <div style={{padding:"14px 14px"}}>
          <GroupedInventory items={filtered} categories={tab.categories} getCat={tab.getCat} onDetail={id=>setShowDetail(id)} onAdjust={openAdjust} onReceive={handleReceive} filterActive={filterActive} dark={dark}/>
        </div>

        {/* Add Modal */}
        {showAdd&&<Modal title={`Add Kit — ${tab.label}`} onClose={()=>setShowAdd(false)} dark={dark}>
          <KitForm form={form} setF={setF} categories={tab.categories} dark={dark}/>
          <div style={{display:"flex",gap:10,marginTop:4}}>
            <button onClick={()=>setShowAdd(false)} style={{flex:1,background:T.bg4,border:`1px solid ${T.border2}`,color:T.text4,borderRadius:10,padding:"11px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
            <button onClick={handleAdd} disabled={!form.compound||!form.vendor} style={{flex:2,background:form.compound&&form.vendor?"#6366f1":T.bg4,color:form.compound&&form.vendor?"#fff":T.text5,border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:800,cursor:form.compound&&form.vendor?"pointer":"not-allowed"}}>Add to Inventory</button>
          </div>
        </Modal>}

        {/* Edit Modal */}
        {showEdit&&editItem&&<Modal title={`Edit — ${editItem.displayCompound}`} onClose={()=>{setShowEdit(null);setForm(emptyForm);}} dark={dark}>
          <KitForm form={form} setF={setF} categories={tab.categories} dark={dark}/>
          <div style={{display:"flex",gap:10,marginTop:4}}>
            <button onClick={()=>{setShowEdit(null);setForm(emptyForm);}} style={{flex:1,background:T.bg4,border:`1px solid ${T.border2}`,color:T.text4,borderRadius:10,padding:"11px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
            <button onClick={handleSaveEdit} style={{flex:2,background:"#6366f1",color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:800,cursor:"pointer"}}>Save Changes</button>
          </div>
        </Modal>}

        {/* Adjust Modal */}
        {showAdjust&&adjustItem&&(()=>{
          const qty=parseInt(adjustQty)||1;
          const vc=adjustUnit==="kit"?qty*(adjustItem.vialsPerKit||1):qty;
          const remaining=Math.max(0,adjustItem.qtyVials-(adjustMode!=="restock"?vc:0));
          return<Modal title={`${adjustItem.displayCompound}${adjustItem.strength?` · ${adjustItem.strength} ${adjustItem.strengthUnit||"mg"}`:""}`} onClose={()=>setShowAdjust(null)} dark={dark}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
              <div style={{background:T.bg4,borderRadius:10,padding:"12px 14px"}}>
                <div style={{fontSize:10,color:T.text4,fontWeight:700,textTransform:"uppercase"}}>Vials Left</div>
                <div style={{fontSize:26,fontWeight:900,color:T.text}}>{adjustItem.qtyVials}</div>
              </div>
              <div style={{background:T.bg4,borderRadius:10,padding:"12px 14px"}}>
                <div style={{fontSize:10,color:T.text4,fontWeight:700,textTransform:"uppercase"}}>Kits ({adjustItem.vialsPerKit||1} ea.)</div>
                <div style={{fontSize:26,fontWeight:900,color:"#818cf8"}}>{adjustItem.vialsPerKit?(adjustItem.qtyVials/adjustItem.vialsPerKit).toFixed(1):"—"}</div>
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={labelStyle}>Action</label>
              <div style={{display:"flex",gap:8}}>
                {["use","sell","restock"].map(m=><button key={m} onClick={()=>setAdjustMode(m)} style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",fontSize:13,fontWeight:800,background:adjustMode===m?"#6366f1":T.bg4,color:adjustMode===m?"#fff":T.text4,cursor:"pointer"}}>{m==="restock"?"Restock":m==="use"?"Used":"Sold"}</button>)}
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={labelStyle}>By</label>
              <div style={{display:"flex",gap:8}}>
                {["vial","kit"].map(u=><button key={u} onClick={()=>{setAdjustUnit(u);setAdjustQty(1);}} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",fontSize:13,fontWeight:700,background:adjustUnit===u?"#0f4c75":T.bg4,color:adjustUnit===u?"#7dd3fc":T.text4,cursor:"pointer"}}>{u==="kit"?`Kit (${adjustItem.vialsPerKit||1} vials)`:"Single Vial"}</button>)}
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={labelStyle}>Quantity ({adjustUnit==="kit"?"kits":"vials"})</label>
              <input type="number" min="1" value={adjustQty} onChange={e=>setAdjustQty(e.target.value)} style={input}/>
            </div>
            <div style={{background:T.bg4,borderRadius:10,padding:"12px 16px",marginBottom:16}}>
              {adjustMode!=="restock"?<div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                <div><div style={{fontSize:10,color:T.text4,textTransform:"uppercase"}}>Deducting</div><div style={{fontSize:18,fontWeight:800,color:"#f87171"}}>{vc} vial{vc!==1?"s":""}</div></div>
                <div><div style={{fontSize:10,color:T.text4,textTransform:"uppercase"}}>Remaining</div><div style={{fontSize:18,fontWeight:800,color:"#6ee7b7"}}>{remaining} vials</div></div>
                {adjustMode==="sell"&&<div><div style={{fontSize:10,color:T.text4,textTransform:"uppercase"}}>Min Sell</div><div style={{fontSize:18,fontWeight:800,color:"#a5b4fc"}}>${(adjustItem.costPerVial*vc).toFixed(2)}</div></div>}
              </div>:<div><div style={{fontSize:10,color:T.text4,textTransform:"uppercase"}}>Adding</div><div style={{fontSize:18,fontWeight:800,color:"#6ee7b7"}}>+{vc} → {adjustItem.qtyVials+vc} total</div></div>}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setShowAdjust(null)} style={{flex:1,background:T.bg4,border:`1px solid ${T.border2}`,color:T.text4,borderRadius:10,padding:"11px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={handleAdjust} style={{flex:2,background:"#6366f1",color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:800,cursor:"pointer"}}>Confirm</button>
            </div>
          </Modal>;
        })()}

        {/* Detail Modal */}
        {showDetail&&detailItem&&<Modal title={`${detailItem.displayCompound}${detailItem.strength?` · ${detailItem.strength} ${detailItem.strengthUnit||"mg"}`:""}`} onClose={()=>setShowDetail(null)} dark={dark}>
          <div style={{marginBottom:12,display:"flex",gap:6,flexWrap:"wrap"}}>
            <CategoryPill name={tab.getCat(detailItem.displayCompound)||"Other"}/>
            <StatusBadge status={detailItem.status||"On Hand"}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {[{label:"Vendor",val:detailItem.vendor||"—"},{label:"Lot #",val:detailItem.lotNumber||"—"},{label:"Status",val:detailItem.status||"On Hand"},{label:"Expected",val:detailItem.expectedDate||"—"},{label:"Kits",val:detailItem.kitsQty||1},{label:"Vials/Kit",val:detailItem.vialsPerKit||1},{label:"Total Vials",val:`${detailItem.qtyVials} / ${detailItem.originalQty}`},{label:"Strength",val:detailItem.strength?`${detailItem.strength} ${detailItem.strengthUnit||"mg"}/vial`:"—"},{label:"Price/Kit",val:`$${detailItem.costPerKit.toFixed(2)}`},{label:"Subtotal",val:`$${(detailItem.costPerKit*(detailItem.kitsQty||1)).toFixed(2)}`},{label:"Shipping",val:`$${detailItem.shipping.toFixed(2)}`},{label:"Fees",val:`$${detailItem.fees.toFixed(2)}`},{label:"Total Paid",val:`$${detailItem.totalCost.toFixed(2)}`},{label:"Cost/Vial",val:`$${detailItem.costPerVial.toFixed(2)}`},{label:`Cost/${detailItem.strengthUnit||"mg"}`,val:detailItem.costPerUnit?`$${detailItem.costPerUnit.toFixed(4)}`:"—"},{label:"Overfill",val:detailItem.overfill||"Unknown"},{label:`Actual ${detailItem.strengthUnit||"mg"}`,val:detailItem.actualStrength?`${detailItem.actualStrength} ${detailItem.strengthUnit||"mg"}`:"—"}].map(r=><div key={r.label} style={{background:T.bg4,borderRadius:8,padding:"9px 12px"}}>
              <div style={{fontSize:10,color:T.text4,fontWeight:700,textTransform:"uppercase"}}>{r.label}</div>
              <div style={{fontSize:13,fontWeight:800,color:T.text,marginTop:2}}>{r.val}</div>
            </div>)}
          </div>
          <div style={{marginBottom:12}}><div style={labelStyle}>COA Status</div><CoaBadges item={detailItem}/></div>
          {detailItem.coaLink&&<div style={{marginBottom:12}}><div style={labelStyle}>COA Link</div><a href={detailItem.coaLink} target="_blank" rel="noreferrer" style={{color:"#818cf8",fontSize:13,wordBreak:"break-all"}}>{detailItem.coaLink}</a></div>}
          {detailItem.notes&&<div style={{marginBottom:12}}><div style={labelStyle}>Notes</div><div style={{fontSize:13,color:T.text2,background:T.bg4,borderRadius:8,padding:"10px 12px"}}>{detailItem.notes}</div></div>}
          {(detailItem.status==="Ordered"||detailItem.status==="In Transit")&&<button onClick={()=>{handleReceive(detailItem.id);setShowDetail(null);}} style={{width:"100%",background:"#052e16",border:"1px solid #86efac",color:"#86efac",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:800,cursor:"pointer",marginBottom:10}}>✓ Mark as Received</button>}
          <div style={{marginBottom:14}}>
            <div style={labelStyle}>Activity Log</div>
            <div style={{background:T.bg4,borderRadius:8,padding:"10px 12px",display:"flex",flexDirection:"column",gap:4,maxHeight:120,overflowY:"auto"}}>
              {(detailItem.log||[]).map((l,i)=><div key={i} style={{fontSize:12,color:T.text4}}>· {l}</div>)}
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>openEdit(detailItem)} style={{flex:1,background:T.bg4,border:"1px solid #6366f1",color:"#a5b4fc",borderRadius:10,padding:"10px 0",fontSize:13,fontWeight:800,cursor:"pointer"}}>✏️ Edit</button>
            <button onClick={()=>{if(confirm("Delete this kit?")){tab.setInventory(prev=>prev.filter(i=>i.id!==detailItem.id));setShowDetail(null);}}} style={{flex:1,background:"none",border:"1px solid #7f1d1d",color:"#f87171",borderRadius:10,padding:"10px 0",fontSize:13,cursor:"pointer"}}>Delete</button>
          </div>
        </Modal>}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>

  <script>
    if('serviceWorker' in navigator){
      const swCode=`const CACHE='peptide-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])));self.skipWaiting();});self.addEventListener('activate',e=>{self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./'))));});`;
      const blob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }
  </script>
</body>
</html>
